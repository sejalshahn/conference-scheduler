<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conference Scheduler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FBF8F2; --ink:#3A342B; --ink-soft:#6B6255;
    --sage:#9FC7A6; --sage-deep:#5E9C6C; --blush:#F0C4C4; --peach:#F3C79B;
    --butter:#F2E6A0; --sky:#ABC7D8; --lav:#C9BEDD; --line:#E7E0D2;
    --card:#FFFFFF; --warn:#C6693A;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--cream);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,.brand{font-family:'Fredoka',sans-serif;}
  #app{max-width:1180px;margin:0 auto;padding:20px 16px 60px;}

  header.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding-bottom:18px;margin-bottom:18px;border-bottom:2px solid var(--line);flex-wrap:wrap;}
  header.top .brand{font-size:26px;font-weight:600;color:var(--ink);margin:0;letter-spacing:.2px;}
  header.top .brand span{color:var(--sage-deep);}
  header.top p{margin:4px 0 0;color:var(--ink-soft);font-size:14px;max-width:480px;}
  .bin-row{display:flex;gap:6px;}
  .bin{width:18px;height:14px;border-radius:3px 3px 5px 5px;}
  .bin.b1{background:var(--sage);} .bin.b2{background:var(--blush);}
  .bin.b3{background:var(--peach);} .bin.b4{background:var(--butter);}
  .bin.b5{background:var(--sky);} .bin.b6{background:var(--lav);}

  .save-bar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:12.5px;color:var(--ink-soft);background:#F4F1E9;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:18px;}
  .save-actions{display:flex;gap:6px;flex-wrap:wrap;}
  .save-actions button{padding:6px 10px;font-size:12px;}
  .sync-badge{font-weight:600;}
  .sync-badge.sync-synced{color:var(--sage-deep);}
  .sync-badge.sync-saving{color:#B08A2E;}
  .sync-badge.sync-offline{color:var(--warn);}
  .sync-badge.sync-checking{color:var(--ink-soft);}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:18px;}
  .card h2{font-size:16px;margin:0 0 12px;font-weight:600;}
  .card h2 small{font-weight:400;color:var(--ink-soft);font-size:12.5px;}

  .format-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;}
  .format-opt{
    border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;
    background:#FCFAF6;transition:border-color .12s ease, background .12s ease;
  }
  .format-opt:hover{border-color:#D8CDB4;}
  .format-opt.active{border-color:var(--sage-deep);background:#F1F8F1;}
  .format-opt input{display:none;}
  .format-opt .f-title{font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px;margin-bottom:4px;}
  .format-opt .f-dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--line);flex:none;}
  .format-opt.active .f-dot{background:var(--sage-deep);border-color:var(--sage-deep);}
  .format-opt .f-desc{font-size:12.5px;color:var(--ink-soft);line-height:1.4;}
  .format-opt .f-time{margin-top:8px;font-size:11.5px;font-weight:600;color:var(--sage-deep);display:inline-block;background:#EEF6EC;border-radius:20px;padding:3px 9px;}
  .format-opt.active .f-time{background:#E1EFDF;}

  .teacher-picker{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);}
  .teacher-picker .lab{font-size:12.5px;color:var(--ink-soft);}

  .settings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;}
  .teacher-window-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;}
  .teacher-window{background:#FCFAF6;border:1px solid var(--line);border-radius:10px;padding:10px 12px;}
  .teacher-window .tw-label{font-size:12.5px;font-weight:600;color:var(--ink);margin-bottom:8px;}
  .field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:4px;font-weight:500;}
  .field input,.field select{width:100%;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;font-size:14px;font-family:'Inter',sans-serif;background:#FCFAF6;color:var(--ink);}
  .field input:focus,.field select:focus{outline:none;border-color:var(--sage-deep);}

  .status-line{margin-top:12px;font-size:13px;padding:10px 12px;border-radius:8px;background:#F4F8F3;color:#3B6B45;border:1px solid #D9EAD8;}
  .status-line.warn{background:#FBF0EA;color:var(--warn);border-color:#F0D6C4;}
  .status-line + .status-line{margin-top:8px;}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
  button{font-family:'Inter',sans-serif;font-weight:600;font-size:13.5px;border-radius:9px;border:1.5px solid transparent;padding:9px 16px;cursor:pointer;transition:transform .08s ease, filter .12s ease;}
  button:active{transform:scale(0.97);}
  .btn-primary{background:var(--sage-deep);color:#fff;}
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-secondary{background:#fff;color:var(--ink);border-color:var(--line);}
  .btn-secondary:hover{background:#F4F1E9;}
  .btn-ghost{background:transparent;color:var(--ink-soft);border-color:transparent;padding:6px 8px;font-size:12.5px;}
  .btn-ghost:hover{color:var(--warn);}
  .btn-big{font-size:15px;padding:12px 22px;}

  .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;max-height:560px;}
  table.grid{border-collapse:separate;border-spacing:0;font-size:12.5px;}
  table.grid th, table.grid td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);}
  table.grid thead th{position:sticky;top:0;background:#F6F2E8;z-index:2;padding:8px 4px;font-weight:600;color:var(--ink-soft);cursor:pointer;user-select:none;white-space:nowrap;font-size:11px;}
  table.grid thead th:hover{background:#EFE9D8;}
  table.grid thead th.blocked{background:#EFE1DC;color:var(--warn);text-decoration:line-through;}
  table.grid thead th.corner{position:sticky;left:0;top:0;z-index:3;background:#F6F2E8;text-align:left;padding:8px 10px;min-width:260px;}
  table.grid td.name-cell{position:sticky;left:0;background:var(--card);z-index:1;padding:6px 10px;min-width:260px;display:flex;align-items:center;gap:6px;flex-wrap:nowrap;}
  table.grid td.name-cell input[type=text]{border:none;background:transparent;font-size:13px;font-weight:500;color:var(--ink);width:92px;padding:4px 2px;border-radius:6px;flex:none;}
  table.grid td.name-cell input[type=text]:focus{outline:none;background:#F4F1E9;}
  table.grid td.name-cell select{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:3px 4px;background:#FCFAF6;color:var(--ink-soft);flex:none;max-width:98px;}
  .pref-count{font-size:10.5px;color:#fff;background:var(--sage);border-radius:20px;padding:1px 7px;white-space:nowrap;flex:none;}
  .pref-count.full{background:var(--sage-deep);}
  .pref-count.over{background:var(--warn);}
  table.grid td.chk{text-align:center;padding:0;width:34px;}
  table.grid td.chk input{width:16px;height:16px;accent-color:var(--sage-deep);cursor:pointer;}
  table.grid td.chk.blocked{background:#FBF6F1;}
  tr:hover td.name-cell{background:#F8F5EC;}

  /* Mobile-friendly preference cards (replaces the old checkbox grid) */
  .pref-list{display:flex;flex-direction:column;gap:10px;}
  .pref-card{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card);}
  .pref-card .head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
  .pref-card .head input[type=text]{font-size:15px;font-weight:600;border:none;background:transparent;flex:1;min-width:110px;padding:6px 4px;border-radius:6px;color:var(--ink);}
  .pref-card .head input[type=text]:focus{outline:none;background:#F4F1E9;}
  .pref-card .head select{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:6px 7px;background:#FCFAF6;color:var(--ink-soft);}
  .chip-row{display:flex;flex-wrap:wrap;gap:7px;}
  .time-chip{font-size:12.5px;font-weight:500;padding:8px 12px;border-radius:20px;border:1.5px solid var(--line);background:#FCFAF6;color:var(--ink-soft);cursor:pointer;user-select:none;white-space:nowrap;-webkit-tap-highlight-color:transparent;}
  .time-chip:hover{border-color:#D8CDB4;}
  .time-chip.selected{background:var(--sage-deep);border-color:var(--sage-deep);color:#fff;}
  .blocked-details{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);}
  .blocked-details summary{cursor:pointer;font-size:12.5px;color:var(--ink-soft);font-weight:500;list-style:none;}
  .blocked-details summary::-webkit-details-marker{display:none;}
  .blocked-details summary:before{content:'▸ ';}
  .blocked-details[open] summary:before{content:'▾ ';}
  .blocked-details[open] summary{margin-bottom:10px;}
  .block-toggle-chip{font-size:12px;padding:7px 11px;border-radius:20px;border:1.5px solid var(--line);background:#FCFAF6;color:var(--ink-soft);cursor:pointer;-webkit-tap-highlight-color:transparent;}
  .block-toggle-chip.blocked{background:#F3DED6;border-color:#E6C7AE;color:var(--warn);text-decoration:line-through;}

  .results h2{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
  .stat-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .stat{flex:1;min-width:110px;background:#F8F5EC;border-radius:10px;padding:10px 12px;}
  .stat .num{font-family:'Fredoka',sans-serif;font-size:22px;font-weight:600;}
  .stat .lab{font-size:11.5px;color:var(--ink-soft);}
  .stat.c1 .num{color:var(--sage-deep);} .stat.c2 .num{color:#B08A2E;}
  .stat.c3 .num{color:#C07A3F;} .stat.c4 .num{color:var(--ink-soft);}
  .stat.c5 .num{color:var(--warn);}

  .sched-list{border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  .sched-row{display:grid;grid-template-columns:110px 1fr 92px 128px;gap:10px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line);font-size:13.5px;}
  .sched-row.no-teacher{grid-template-columns:110px 1fr 128px;}
  .sched-row:last-child{border-bottom:none;}
  .sched-row:nth-child(odd){background:#FBF9F4;}
  .sched-time{font-weight:600;color:var(--ink);}
  .badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;text-align:center;white-space:nowrap;}
  .badge.p1{background:#E4F2E2;color:#3B7A45;} .badge.p2{background:#F5EDCB;color:#8A6B15;}
  .badge.p3{background:#F7E1CB;color:#A2601F;} .badge.pnear{background:#EFE9D8;color:var(--ink-soft);}
  .badge.pnone{background:#F1EEE6;color:#9A927F;}
  .badge.teacher-w{background:#E6EEF3;color:#3E6A85;} .badge.teacher-c{background:#EEE8F4;color:#6E5590;}
  .unsched{margin-top:14px;padding:12px 14px;background:#FBF0EA;border:1px solid #F0D6C4;border-radius:10px;color:var(--warn);font-size:13.5px;}

  footer{text-align:center;color:var(--ink-soft);font-size:12px;margin-top:24px;}
  @media (max-width:560px){
    .sched-row{grid-template-columns:78px 1fr 78px 100px;font-size:12.5px;}
    .sched-row.no-teacher{grid-template-columns:78px 1fr 100px;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ---------- Roster ---------- */
const RAW_NAMES = [
  "Willow","Elodie","Emmie","Rook","Abigail","Ivana",
  "Maren","Rory","Palmer","Nickie","Noah","Eleanor",
  "James","Gabriel","Olive","Christian","David","Connor",
  "Adele","Siena","Laurel","Harper","Evelyn","Jocelyn",
  "Liam","Palmer","Nico","Michael","Blair","Brooks",
  "Gwendy","Barrett","Viana","Kush","Shaan","Mia"
];
function dedupeNames(names){
  const seen = {};
  return names.map(n=>{ seen[n]=(seen[n]||0)+1; return seen[n]>1 ? `${n} (${seen[n]})` : n; });
}

const TEACHERS = ["Ms. Walsh","Ms. Capparelli"];

let state = {
  students: dedupeNames(RAW_NAMES).map((name,i)=>({id:'s'+i, name, prefs:[null,null,null], teacher: i<18 ? TEACHERS[1] : TEACHERS[0], needs:'both'})),
  settings: { walshStart:"08:00", walshEnd:"14:00", cappStart:"08:00", cappEnd:"14:00", duration:10, capacity:1 },
  blocked: new Set(),
  format: 'joint', // 'joint' | 'split' | 'rotate'
  blockedOpen: false,
  schedule: null,
  nextId: RAW_NAMES.length
};

/* ---------- Persistence: auto-save to this browser + manual backup file ---------- */
const STORAGE_KEY = 'pt-conference-scheduler-v1';
function serializeState(){
  return {
    students: state.students,
    settings: state.settings,
    blocked: Array.from(state.blocked),
    format: state.format,
    blockedOpen: state.blockedOpen,
    nextId: state.nextId
  };
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(serializeState())); }catch(e){ /* storage unavailable, fail silently */ }
}
function applyLoadedState(data){
  if(!data || !Array.isArray(data.students)) return false;
  state.students = data.students.map(s=>({
    id: s.id, name: s.name, prefs: s.prefs || [null,null,null],
    teacher: s.teacher || null, needs: s.needs || 'both'
  }));
  const incoming = data.settings || {};
  if(incoming.start && !incoming.walshStart){
    // migrate an older single-window backup to the new per-teacher shape
    incoming.walshStart = incoming.start; incoming.walshEnd = incoming.end;
    incoming.cappStart = incoming.start; incoming.cappEnd = incoming.end;
  }
  state.settings = Object.assign({walshStart:"08:00", walshEnd:"14:00", cappStart:"08:00", cappEnd:"14:00", duration:10, capacity:1}, incoming);
  state.blocked = new Set(data.blocked || []);
  state.format = data.format || 'joint';
  state.blockedOpen = !!data.blockedOpen;
  state.nextId = data.nextId || state.students.length;
  return true;
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return false;
    return applyLoadedState(JSON.parse(raw));
  }catch(e){ return false; }
}
function resetToDefaults(){
  state.students = dedupeNames(RAW_NAMES).map((name,i)=>({id:'s'+i, name, prefs:[null,null,null], teacher: i<18 ? TEACHERS[1] : TEACHERS[0], needs:'both'}));
  state.settings = { walshStart:"08:00", walshEnd:"14:00", cappStart:"08:00", cappEnd:"14:00", duration:10, capacity:1 };
  state.blocked = new Set();
  state.format = 'joint';
  state.blockedOpen = false;
  state.schedule = null;
  state.nextId = RAW_NAMES.length;
}
function exportBackup(){
  const blob = new Blob([JSON.stringify(serializeState(), null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download='conference-scheduler-backup.json'; a.click();
  URL.revokeObjectURL(url);
}

/* ---------- Optional cross-device sync via /api/state (Vercel KV) ----------
   If this file is deployed on Vercel with the included api/state.js + KV
   database connected, changes sync across browsers/devices. If the API route
   isn't there (plain static hosting, or opened as a local file), this fails
   silently and the app just falls back to the per-browser localStorage save
   above — nothing else breaks. */
let syncStatus = 'checking'; // 'checking' | 'synced' | 'saving' | 'offline'
let cloudSaveTimer = null;
function syncBadgeText(s){
  return s==='synced' ? 'Synced across devices ✓'
    : s==='saving' ? 'Syncing…'
    : s==='offline' ? 'Saved on this device only'
    : 'Checking sync…';
}
function setSyncStatus(s){
  syncStatus = s;
  const el = document.getElementById('syncBadge');
  if(el){ el.textContent = syncBadgeText(s); el.className = 'sync-badge sync-'+s; }
}
async function loadFromCloud(){
  try{
    const res = await fetch('/api/state');
    if(!res.ok) return {reachable:false, applied:false};
    const json = await res.json();
    if(json && json.data) return {reachable:true, applied: applyLoadedState(json.data)};
    return {reachable:true, applied:false};
  }catch(e){ return {reachable:false, applied:false}; }
}
async function saveToCloud(){
  try{
    const res = await fetch('/api/state', {
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(serializeState())
    });
    setSyncStatus(res.ok ? 'synced' : 'offline');
  }catch(e){ setSyncStatus('offline'); }
}
function scheduleCloudSave(){
  setSyncStatus('saving');
  if(cloudSaveTimer) clearTimeout(cloudSaveTimer);
  cloudSaveTimer = setTimeout(saveToCloud, 800);
}

/* ---------- Time helpers ---------- */
function toMinutes(hhmm){ const [h,m]=hhmm.split(':').map(Number); return h*60+m; }
function toLabel(mins){
  let h=Math.floor(mins/60), m=mins%60;
  const ampm = h>=12?'PM':'AM'; let h12=h%12; if(h12===0) h12=12;
  return `${h12}:${m.toString().padStart(2,'0')} ${ampm}`;
}
function inWindow(slot, key, dur){
  const s = toMinutes(state.settings[key+'Start']);
  const e = toMinutes(state.settings[key+'End']);
  return slot.minutes >= s && slot.minutes+dur <= e;
}
function generateSlots(){
  const dur=Number(state.settings.duration)||10;
  const start = Math.min(toMinutes(state.settings.walshStart), toMinutes(state.settings.cappStart));
  const end = Math.max(toMinutes(state.settings.walshEnd), toMinutes(state.settings.cappEnd));
  const slots=[]; let i=0;
  for(let t=start; t+dur<=end; t+=dur){ slots.push({index:i, minutes:t, label:toLabel(t)}); i++; }
  return slots;
}
function generateUnits(slots, mode){
  // mode: 'walsh' -> only slots Walsh is free, 'capp' -> only slots Capparelli is free,
  // anything else (default) -> slots where BOTH are free (needed for a joint/together meeting)
  const dur = Number(state.settings.duration)||10;
  const usable = slots.filter(s=>{
    if(state.blocked.has(s.index)) return false;
    if(mode==='walsh') return inWindow(s,'walsh',dur);
    if(mode==='capp') return inWindow(s,'capp',dur);
    return inWindow(s,'walsh',dur) && inWindow(s,'capp',dur);
  });
  return usable.map(s=>({slotsIn:[s], label:s.label, minutes:s.minutes}));
}

/* ---------- Scoring ---------- */
function slotScore(prefs, realIndex){
  if(prefs.includes(realIndex)) return 100;
  const given = prefs.filter(p=>p!==null && p!==undefined);
  if(given.length===0) return 12;
  const minDist = Math.min(...given.map(p=>Math.abs(p-realIndex)));
  return Math.max(1, 34 - minDist*7);
}
function unitScore(prefs, unit){
  return Math.max(...unit.slotsIn.map(s=>slotScore(prefs, s.index)));
}
function unitTier(prefs, unit){
  const indices = unit.slotsIn.map(s=>s.index);
  if(indices.some(i=>prefs.includes(i))) return 'matched';
  if(prefs.some(p=>p!==null)) return 'near';
  return 'none';
}
function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function hasPrefs(st){ return st.prefs.some(p=>p!==null); }

/* ---------- Generic optimizer over a list of units for a given student list ---------- */
function buildVirtualUnits(units, capacity){
  const vu=[];
  for(const u of units){ for(let c=0;c<capacity;c++) vu.push(u); }
  return vu;
}
function greedyAssign(students, vunits){
  const used = new Array(vunits.length).fill(false);
  const assign = {};
  for(const st of students){
    let bestVi=-1, bestScore=-Infinity;
    for(let vi=0; vi<vunits.length; vi++){
      if(used[vi]) continue;
      const sc = unitScore(st.prefs, vunits[vi]);
      if(sc>bestScore){ bestScore=sc; bestVi=vi; }
    }
    if(bestVi>=0){ assign[st.id]={vi:bestVi, score:bestScore}; used[bestVi]=true; }
    else assign[st.id]=null;
  }
  return assign;
}
function totalScore(assign){ return Object.values(assign).reduce((s,a)=>s+(a?a.score:0),0); }
function localSearch(students, vunits, assign){
  let improved=true, passes=0;
  while(improved && passes<6){
    improved=false; passes++;
    for(let i=0;i<students.length;i++){
      for(let j=i+1;j<students.length;j++){
        const a=students[i], b=students[j];
        const aa=assign[a.id], bb=assign[b.id];
        if(aa && bb){
          const curr=aa.score+bb.score;
          const swapA=unitScore(a.prefs, vunits[bb.vi]);
          const swapB=unitScore(b.prefs, vunits[aa.vi]);
          if(swapA+swapB>curr){ assign[a.id]={vi:bb.vi,score:swapA}; assign[b.id]={vi:aa.vi,score:swapB}; improved=true; }
        } else if(aa && !bb){
          const bAtA=unitScore(b.prefs, vunits[aa.vi]);
          if(bAtA>aa.score){ assign[b.id]={vi:aa.vi,score:bAtA}; assign[a.id]=null; improved=true; }
        } else if(!aa && bb){
          const aAtB=unitScore(a.prefs, vunits[bb.vi]);
          if(aAtB>bb.score){ assign[a.id]={vi:bb.vi,score:aAtB}; assign[b.id]=null; improved=true; }
        }
      }
    }
  }
  return assign;
}
function optimizeGroup(students, units, capacity){
  if(students.length===0) return {};
  const vunits = buildVirtualUnits(units, capacity);
  let best=null, bestScore=-Infinity;
  const restarts = 70;
  for(let r=0;r<restarts;r++){
    const order = shuffle(students);
    let assign = greedyAssign(order, vunits);
    assign = localSearch(students, vunits, assign);
    const sc = totalScore(assign);
    if(sc>bestScore){ bestScore=sc; best=assign; }
  }
  const results = {};
  students.forEach(st=>{
    const a = best[st.id];
    if(!a){ results[st.id] = {assigned:false}; return; }
    const unit = vunits[a.vi];
    results[st.id] = {assigned:true, unit, tier:unitTier(st.prefs, unit)};
  });
  return results;
}

function scheduleRotate(students, slots){
  const open = slots.filter(s=>!state.blocked.has(s.index)).sort((a,b)=>a.minutes-b.minutes);
  const dur = Number(state.settings.duration)||10;

  function attempt(order){
    const usedWalsh = {}, usedCapp = {};
    open.forEach(s=>{
      usedWalsh[s.index] = !inWindow(s,'walsh',dur); // pre-block slots outside Walsh's own hours
      usedCapp[s.index] = !inWindow(s,'capp',dur);   // pre-block slots outside Capparelli's own hours
    });
    const assign = {};
    for(const st of order){
      const need = st.needs || 'both';
      let best = null;
      if(need==='walsh' || need==='capparelli'){
        const usedLane = need==='walsh' ? usedWalsh : usedCapp;
        for(const s of open){
          if(usedLane[s.index]) continue;
          const sc = slotScore(st.prefs, s.index);
          if(!best || sc>best.score) best = {score:sc, kind:'single', lane:need, slot:s};
        }
      } else {
        for(let i=0;i<open.length;i++){
          const a=open[i], b=open[i+1];
          if(!b || b.minutes !== a.minutes+dur) continue;
          if(!usedWalsh[a.index] && !usedCapp[b.index]){
            const sc = unitScore(st.prefs, {slotsIn:[a,b]});
            if(!best || sc>best.score) best = {score:sc, kind:'pair', order:'WC', a, b};
          }
          if(!usedCapp[a.index] && !usedWalsh[b.index]){
            const sc = unitScore(st.prefs, {slotsIn:[a,b]});
            if(!best || sc>best.score) best = {score:sc, kind:'pair', order:'CW', a, b};
          }
        }
      }
      if(best){
        if(best.kind==='single'){
          (best.lane==='walsh' ? usedWalsh : usedCapp)[best.slot.index] = true;
        } else if(best.order==='WC'){
          usedWalsh[best.a.index]=true; usedCapp[best.b.index]=true;
        } else {
          usedCapp[best.a.index]=true; usedWalsh[best.b.index]=true;
        }
      }
      assign[st.id] = best;
    }
    return assign;
  }

  let bestAssign=null, bestTotal=-Infinity;
  const restarts = students.length>0 ? 120 : 0;
  for(let r=0;r<restarts;r++){
    const assign = attempt(shuffle(students));
    const total = Object.values(assign).reduce((s,a)=>s+(a?a.score:0),0);
    if(total>bestTotal){ bestTotal=total; bestAssign=assign; }
  }

  const results = {};
  students.forEach(st=>{
    const a = bestAssign ? bestAssign[st.id] : null;
    if(!a){ results[st.id] = {assigned:false, teacher:null}; return; }
    let unit, teacher;
    if(a.kind==='single'){
      teacher = a.lane==='walsh' ? TEACHERS[0] : TEACHERS[1];
      unit = {slotsIn:[a.slot], label:`${a.slot.label} (${teacher.replace('Ms. ','')} only)`, minutes:a.slot.minutes};
    } else {
      const first = a.order==='WC' ? 'Walsh' : 'Capparelli';
      const second = a.order==='WC' ? 'Capparelli' : 'Walsh';
      teacher = null;
      unit = {slotsIn:[a.a,a.b], label:`${a.a.label} – ${toLabel(a.b.minutes+dur)} (${first} then ${second})`, minutes:a.a.minutes};
    }
    results[st.id] = {assigned:true, unit, tier:unitTier(st.prefs, unit), teacher};
  });
  return results;
}

function runOptimizer(){
  const slots = generateSlots();
  let combined = [];

  const noRequest = state.students.filter(s=>!hasPrefs(s));
  const wants = state.students.filter(hasPrefs);
  const needOf = s => s.needs || 'both';

  if(state.format==='split'){
    const walsh = wants.filter(s=> needOf(s)==='walsh' || needOf(s)==='both');
    const capp = wants.filter(s=> needOf(s)==='capparelli' || needOf(s)==='both');
    const unitsWalsh = generateUnits(slots,'walsh');
    const unitsCapp = generateUnits(slots,'capp');
    const rW = optimizeGroup(walsh, unitsWalsh, 1);
    const rC = optimizeGroup(capp, unitsCapp, 1);
    walsh.forEach(st=> combined.push({student:st, teacher:TEACHERS[0], ...rW[st.id]}));
    capp.forEach(st=> combined.push({student:st, teacher:TEACHERS[1], ...rC[st.id]}));
  } else if(state.format==='rotate'){
    const r = scheduleRotate(wants, slots);
    wants.forEach(st=> combined.push({student:st, ...r[st.id]}));
  } else {
    const units = generateUnits(slots,'joint');
    const capacity = Number(state.settings.capacity||1);
    const r = optimizeGroup(wants, units, capacity);
    wants.forEach(st=>{
      const need = needOf(st);
      const teacher = need==='both' ? null : (need==='walsh' ? TEACHERS[0] : TEACHERS[1]);
      combined.push({student:st, teacher, ...r[st.id]});
    });
  }
  noRequest.forEach(st=> combined.push({student:st, teacher:null, assigned:false, noRequest:true}));

  state.schedule = { results: combined };
  render();
}

        ${formatOption('joint','Together, one room','Ms. Walsh and Ms. Capparelli both sit in on every meeting. One appointment per family, one shared timeline.')}

function formatOption(key, title, desc){
  const active = state.format===key;
  const base = Number(state.settings.duration)||10;
  const mins = key==='rotate' ? base*2 : base;
  const timeNote = key==='rotate'
    ? `${mins} min total per student (${base} min with each teacher)`
    : `${mins} min per student`;
  return `<label class="format-opt ${active?'active':''}" data-format="${key}">
    <input type="radio" name="format" value="${key}" ${active?'checked':''}>
    <div class="f-title"><span class="f-dot"></span>${title}</div>
    <div class="f-desc">${desc}</div>
    <div class="f-time">${timeNote}</div>
  </label>`;
}

function renderStatus(slots){
  const wantsAll = state.students.filter(hasPrefs);
  const n = wantsAll.length;
  const optedOut = state.students.length - n;
  const optOutLine = optedOut>0 ? `<div class="status-line">${optedOut} student${optedOut>1?'s':''} with no times checked won't be scheduled (assumed no conference requested).</div>` : '';
  const needOf = s => s.needs || 'both';
  const dur = Number(state.settings.duration)||10;
  if(state.format==='split'){
    const walshN = wantsAll.filter(s=>needOf(s)==='walsh' || needOf(s)==='both').length;
    const cappN = wantsAll.filter(s=>needOf(s)==='capparelli' || needOf(s)==='both').length;
    const walshOpen = generateUnits(slots,'walsh').length;
    const cappOpen = generateUnits(slots,'capp').length;
    const wOk = walshOpen >= walshN, cOk = cappOpen >= cappN;
    let lines = `
      <div class="status-line ${wOk?'':'warn'}">Ms. Walsh: ${walshOpen} slots available for ${walshN} students. ${wOk?'Enough room.':'Not enough — extend her hours or shorten slots.'}</div>
      <div class="status-line ${cOk?'':'warn'}">Ms. Capparelli: ${cappOpen} slots available for ${cappN} students. ${cOk?'Enough room.':'Not enough — extend her hours or shorten slots.'}</div>
    `;
    return lines + optOutLine;
  }
  if(state.format==='rotate'){
    const openWalsh = slots.filter(s=>!state.blocked.has(s.index) && inWindow(s,'walsh',dur)).length;
    const openCapp = slots.filter(s=>!state.blocked.has(s.index) && inWindow(s,'capp',dur)).length;
    const bothN = wantsAll.filter(s=>needOf(s)==='both').length;
    const walshOnlyN = wantsAll.filter(s=>needOf(s)==='walsh').length;
    const cappOnlyN = wantsAll.filter(s=>needOf(s)==='capparelli').length;
    const walshDemand = bothN + walshOnlyN, cappDemand = bothN + cappOnlyN;
    const ok = walshDemand<=openWalsh && cappDemand<=openCapp;
    return `<div class="status-line ${ok?'':'warn'}">Ms. Walsh has ${openWalsh} slots (needs ${walshDemand}); Ms. Capparelli has ${openCapp} slots (needs ${cappDemand}). Two-teacher families count toward both. ${ok?'Enough room.':'Not enough — extend hours or shorten the per-teacher time.'}</div>${optOutLine}`;
  }
  const jointOpen = generateUnits(slots,'joint').length;
  const capacity = Number(state.settings.capacity||1);
  const total = jointOpen*capacity;
  const ok = total >= n;
  return `<div class="status-line ${ok?'':'warn'}">${total} total slots available (${jointOpen} time × ${capacity} at once, when both teachers are free) for ${n} students. ${ok?"There's enough room for everyone.":"Not enough room yet — check that both teachers' hours overlap, shorten the slot length, or add rooms."}</div>${optOutLine}`;
}

function renderBlockedPicker(slots){
  const chips = slots.map(s=>{
    const blocked = state.blocked.has(s.index);
    return `<button type="button" class="block-toggle-chip ${blocked?'blocked':''}" data-toggle-block="${s.index}">${s.label}</button>`;
  }).join('');
  const summaryText = state.blocked.size>0
    ? `${state.blocked.size} time${state.blocked.size>1?'s':''} blocked — tap to edit`
    : 'Block a time off (e.g. a lunch break)';
  return `<details class="blocked-details" ${state.blockedOpen?'open':''}>
    <summary>${summaryText}</summary>
    <div class="chip-row">${chips}</div>
  </details>`;
}

function renderPreferenceCards(slots){
  const openSlots = slots.filter(s=>!state.blocked.has(s.index));
  const cards = state.students.map(st=>{
    const count = st.prefs.filter(p=>p!==null).length;
    const chips = openSlots.map(s=>{
      const selected = st.prefs.includes(s.index);
      return `<button type="button" class="time-chip ${selected?'selected':''}" data-chip-student="${st.id}" data-chip-slot="${s.index}">${s.label}</button>`;
    }).join('');
    return `<div class="pref-card">
      <div class="head">
        <input type="text" value="${escapeHtml(st.name)}" data-rename="${st.id}">
        <select data-teacher="${st.id}" title="Homeroom teacher">
          <option value="">— homeroom —</option>
          <option value="${TEACHERS[0]}" ${st.teacher===TEACHERS[0]?'selected':''}>Walsh</option>
          <option value="${TEACHERS[1]}" ${st.teacher===TEACHERS[1]?'selected':''}>Capparelli</option>
        </select>
        <select data-needs="${st.id}" title="Which teacher(s) this family still needs a conference with">
          <option value="both" ${(st.needs||'both')==='both'?'selected':''}>Needs both</option>
          <option value="walsh" ${st.needs==='walsh'?'selected':''}>Walsh only</option>
          <option value="capparelli" ${st.needs==='capparelli'?'selected':''}>Capparelli only</option>
        </select>
        <span class="pref-count ${count>3?'over':count===3?'full':''}">${count}/3</span>
        <button class="btn-ghost" data-remove="${st.id}" title="Remove student">✕</button>
      </div>
      <div class="chip-row">${chips}</div>
    </div>`;
  }).join('');
  return `<div class="pref-list">${cards}</div>`;
}

function renderResults(schedule){
  const {results} = schedule;
  const assigned = results.filter(r=>r.assigned).sort((a,b)=>a.unit.minutes-b.unit.minutes);
  const unassigned = results.filter(r=>!r.assigned && !r.noRequest);
  const noRequest = results.filter(r=>r.noRequest);

  const counts = {matched:0, near:0, none:0};
  assigned.forEach(r=>counts[r.tier]++);

  const tierLabel = {matched:'Got a preferred time', near:'Closest available', none:'No preference given'};
  const tierBadge = {matched:'p1', near:'pnear', none:'pnone'};

  return `
    <section class="card results">
      <h2>Optimized schedule <button class="btn-secondary" id="exportBtn">Export CSV</button></h2>
      <div class="stat-row">
        <div class="stat c1"><div class="num">${counts.matched}</div><div class="lab">Got a preferred time</div></div>
        <div class="stat c4"><div class="num">${counts.near}</div><div class="lab">Closest available</div></div>
        <div class="stat c5"><div class="num">${unassigned.length}</div><div class="lab">Could not schedule</div></div>
      </div>
      <div class="sched-list">
        ${assigned.map(r=>{
          const hasTeacherBadge = !!r.teacher;
          return `<div class="sched-row ${hasTeacherBadge?'':'no-teacher'}">
            <div class="sched-time">${r.unit.label}</div>
            <div>${escapeHtml(r.student.name)}</div>
            ${hasTeacherBadge ? `<div class="badge ${r.teacher===TEACHERS[0]?'teacher-w':'teacher-c'}">${r.teacher.replace('Ms. ','')}</div>` : ''}
            <div class="badge ${tierBadge[r.tier]}">${tierLabel[r.tier]}</div>
          </div>`;
        }).join('')}
      </div>
      ${unassigned.length ? `<div class="unsched"><strong>${unassigned.length} student${unassigned.length>1?'s':''} couldn't be fit in:</strong> ${unassigned.map(r=>escapeHtml(r.student.name)).join(', ')}. Add more room above and re-run.</div>` : ''}
      ${noRequest.length ? `<div class="status-line" style="margin-top:14px;"><strong>${noRequest.length} student${noRequest.length>1?'s':''} left off</strong> — no times were checked, so no conference was requested: ${noRequest.map(r=>escapeHtml(r.student.name)).join(', ')}.</div>` : ''}
    </section>
  `;
}

function escapeHtml(str){ const d=document.createElement('div'); d.textContent=str; return d.innerHTML; }

/* ---------- Event wiring ---------- */
function attachHandlers(slots){
  document.querySelectorAll('.format-opt').forEach(el=>{
    el.onclick = ()=>{ state.format = el.dataset.format; state.schedule=null; render(); };
  });

  document.getElementById('walshStart').onchange = e=>{ state.settings.walshStart=e.target.value; state.schedule=null; render(); };
  document.getElementById('walshEnd').onchange = e=>{ state.settings.walshEnd=e.target.value; state.schedule=null; render(); };
  document.getElementById('cappStart').onchange = e=>{ state.settings.cappStart=e.target.value; state.schedule=null; render(); };
  document.getElementById('cappEnd').onchange = e=>{ state.settings.cappEnd=e.target.value; state.schedule=null; render(); };
  document.getElementById('duration').onchange = e=>{ state.settings.duration=e.target.value; state.schedule=null; render(); };
  const capEl = document.getElementById('capacity');
  if(capEl) capEl.onchange = e=>{ state.settings.capacity=e.target.value; state.schedule=null; render(); };

  document.getElementById('optimizeBtn').onclick = ()=> runOptimizer();
  document.getElementById('addStudentBtn').onclick = ()=>{
    state.students.push({id:'s'+(state.nextId++), name:'New student', prefs:[null,null,null], teacher:null, needs:'both'});
    state.schedule=null; render();
  };
  document.getElementById('clearPrefsBtn').onclick = ()=>{
    state.students.forEach(s=>s.prefs=[null,null,null]); state.schedule=null; render();
  };
  const exportBtn = document.getElementById('exportBtn');
  if(exportBtn) exportBtn.onclick = exportCSV;

  const backupBtn = document.getElementById('backupBtn');
  if(backupBtn) backupBtn.onclick = exportBackup;
  const resetBtn = document.getElementById('resetBtn');
  if(resetBtn) resetBtn.onclick = ()=>{
    if(confirm('This clears all saved names, preferences, and settings in this browser and starts over with the default roster. Continue?')){
      try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
      resetToDefaults();
      render();
    }
  };
  const restoreBtn = document.getElementById('restoreBtn');
  const restoreFile = document.getElementById('restoreFile');
  if(restoreBtn && restoreFile){
    restoreBtn.onclick = ()=> restoreFile.click();
    restoreFile.onchange = (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = ()=>{
        try{
          const data = JSON.parse(reader.result);
          if(!applyLoadedState(data)) throw new Error('bad file');
          state.schedule = null;
          saveState();
          render();
        }catch(err){ alert('Could not read that backup file — it may not be a scheduler backup.'); }
      };
      reader.readAsText(file);
      restoreFile.value = '';
    };
  }

  document.querySelectorAll('[data-toggle-block]').forEach(btn=>{
    btn.onclick = ()=>{
      const idx = Number(btn.dataset.toggleBlock);
      if(state.blocked.has(idx)) state.blocked.delete(idx); else state.blocked.add(idx);
      state.blockedOpen = true;
      state.schedule=null; render();
    };
  });
  const blockedDetails = document.querySelector('.blocked-details');
  if(blockedDetails) blockedDetails.addEventListener('toggle', function(){ state.blockedOpen = this.open; });

  document.querySelectorAll('.time-chip[data-chip-student]').forEach(chip=>{
    chip.onclick = ()=>{
      const st = state.students.find(s=>s.id===chip.dataset.chipStudent);
      const slotIdx = Number(chip.dataset.chipSlot);
      const pos = st.prefs.indexOf(slotIdx);
      if(pos>=0){
        st.prefs[pos] = null;
      } else {
        const filled = st.prefs.filter(p=>p!==null).length;
        if(filled>=3){ alert(`${st.name} already has 3 preferred times selected. Tap one to remove it first.`); return; }
        st.prefs[st.prefs.indexOf(null)] = slotIdx;
      }
      state.schedule=null; render();
    };
  });

  document.querySelectorAll('input[data-rename]').forEach(inp=>{
    inp.onchange = ()=>{ const st=state.students.find(s=>s.id===inp.dataset.rename); st.name=inp.value.trim()||'Unnamed'; state.schedule=null; saveState(); scheduleCloudSave(); };
  });

  document.querySelectorAll('select[data-teacher]').forEach(sel=>{
    sel.onchange = ()=>{ const st=state.students.find(s=>s.id===sel.dataset.teacher); st.teacher = sel.value || null; state.schedule=null; saveState(); scheduleCloudSave(); };
  });

  document.querySelectorAll('select[data-needs]').forEach(sel=>{
    sel.onchange = ()=>{ const st=state.students.find(s=>s.id===sel.dataset.needs); st.needs = sel.value || 'both'; state.schedule=null; render(); };
  });

  document.querySelectorAll('button[data-remove]').forEach(btn=>{
    btn.onclick = ()=>{ state.students = state.students.filter(s=>s.id!==btn.dataset.remove); state.schedule=null; render(); };
  });
}

function exportCSV(){
  const {results} = state.schedule;
  const assigned = results.filter(r=>r.assigned).sort((a,b)=>a.unit.minutes-b.unit.minutes);
  const tierLabel = {matched:'Got a preferred time', near:'Closest available', none:'No preference given'};
  const rows = [['Time','Student','Teacher','Match']];
  assigned.forEach(r=> rows.push([r.unit.label, r.student.name, r.teacher ? r.teacher.replace('Ms. ','') : 'Both', tierLabel[r.tier]]));
  const leftover = results.filter(r=>!r.assigned && !r.noRequest);
  leftover.forEach(r=> rows.push(['UNSCHEDULED', r.student.name, r.teacher ? r.teacher.replace('Ms. ','') : 'Both', '—']));
  const csv = rows.map(row=> row.map(cell=>`"${String(cell).replace(/"/g,'""')}"`).join(',')).join('\\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download='conference-schedule.csv'; a.click();
  URL.revokeObjectURL(url);
}

loadState();  // instant baseline from this browser, so the page never looks empty
render();
loadFromCloud().then(result=>{
  if(result.applied){ state.schedule = null; render(); }
  else { setSyncStatus(result.reachable ? 'synced' : 'offline'); }
});

</script>
</body>
</html>
