<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conference Scheduler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FBF8F2; --ink:#3A342B; --ink-soft:#6B6255;
    --sage:#9FC7A6; --sage-deep:#5E9C6C; --blush:#F0C4C4; --peach:#F3C79B;
    --butter:#F2E6A0; --sky:#ABC7D8; --lav:#C9BEDD; --line:#E7E0D2;
    --card:#FFFFFF; --warn:#C6693A;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--cream);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,.brand{font-family:'Fredoka',sans-serif;}
  #app{max-width:1180px;margin:0 auto;padding:20px 16px 60px;}

  header.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding-bottom:18px;margin-bottom:18px;border-bottom:2px solid var(--line);flex-wrap:wrap;}
  header.top .brand{font-size:26px;font-weight:600;color:var(--ink);margin:0;letter-spacing:.2px;}
  header.top .brand span{color:var(--sage-deep);}
  header.top p{margin:4px 0 0;color:var(--ink-soft);font-size:14px;max-width:480px;}
  .bin-row{display:flex;gap:6px;}
  .bin{width:18px;height:14px;border-radius:3px 3px 5px 5px;}
  .bin.b1{background:var(--sage);} .bin.b2{background:var(--blush);}
  .bin.b3{background:var(--peach);} .bin.b4{background:var(--butter);}
  .bin.b5{background:var(--sky);} .bin.b6{background:var(--lav);}

  .save-bar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:12.5px;color:var(--ink-soft);background:#F4F1E9;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:18px;}
  .save-actions{display:flex;gap:6px;flex-wrap:wrap;}
  .save-actions button{padding:6px 10px;font-size:12px;}
  .sync-badge{font-weight:600;}
  .sync-badge.sync-synced{color:var(--sage-deep);}
  .sync-badge.sync-saving{color:#B08A2E;}
  .sync-badge.sync-offline{color:var(--warn);}
  .sync-badge.sync-checking{color:var(--ink-soft);}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:18px;}
  .card h2{font-size:16px;margin:0 0 12px;font-weight:600;}
  .card h2 small{font-weight:400;color:var(--ink-soft);font-size:12.5px;}

  .format-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;}
  .format-opt{
    border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;
    background:#FCFAF6;transition:border-color .12s ease, background .12s ease;
  }
  .format-opt:hover{border-color:#D8CDB4;}
  .format-opt.active{border-color:var(--sage-deep);background:#F1F8F1;}
  .format-opt input{display:none;}
  .format-opt .f-title{font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px;margin-bottom:4px;}
  .format-opt .f-dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--line);flex:none;}
  .format-opt.active .f-dot{background:var(--sage-deep);border-color:var(--sage-deep);}
  .format-opt .f-desc{font-size:12.5px;color:var(--ink-soft);line-height:1.4;}
  .format-opt .f-time{margin-top:8px;font-size:11.5px;font-weight:600;color:var(--sage-deep);display:inline-block;background:#EEF6EC;border-radius:20px;padding:3px 9px;}
  .format-opt.active .f-time{background:#E1EFDF;}

  .teacher-picker{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);}
  .teacher-picker .lab{font-size:12.5px;color:var(--ink-soft);}

  .settings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;}
  .teacher-window-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;}
  .teacher-window{background:#FCFAF6;border:1px solid var(--line);border-radius:10px;padding:10px 12px;}
  .teacher-window .tw-label{font-size:12.5px;font-weight:600;color:var(--ink);margin-bottom:8px;}
  .field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:4px;font-weight:500;}
  .field input,.field select{width:100%;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;font-size:14px;font-family:'Inter',sans-serif;background:#FCFAF6;color:var(--ink);}
  .field input:focus,.field select:focus{outline:none;border-color:var(--sage-deep);}

  .status-line{margin-top:12px;font-size:13px;padding:10px 12px;border-radius:8px;background:#F4F8F3;color:#3B6B45;border:1px solid #D9EAD8;}
  .status-line.warn{background:#FBF0EA;color:var(--warn);border-color:#F0D6C4;}
  .status-line + .status-line{margin-top:8px;}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
  button{font-family:'Inter',sans-serif;font-weight:600;font-size:13.5px;border-radius:9px;border:1.5px solid transparent;padding:9px 16px;cursor:pointer;transition:transform .08s ease, filter .12s ease;}
  button:active{transform:scale(0.97);}
  .btn-primary{background:var(--sage-deep);color:#fff;}
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-secondary{background:#fff;color:var(--ink);border-color:var(--line);}
  .btn-secondary:hover{background:#F4F1E9;}
  .btn-ghost{background:transparent;color:var(--ink-soft);border-color:transparent;padding:6px 8px;font-size:12.5px;}
  .btn-ghost:hover{color:var(--warn);}
  .btn-big{font-size:15px;padding:12px 22px;}

  .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;max-height:560px;}
  table.grid{border-collapse:separate;border-spacing:0;font-size:12.5px;}
  table.grid th, table.grid td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);}
  table.grid thead th{position:sticky;top:0;background:#F6F2E8;z-index:2;padding:8px 4px;font-weight:600;color:var(--ink-soft);cursor:pointer;user-select:none;white-space:nowrap;font-size:11px;}
  table.grid thead th:hover{background:#EFE9D8;}
  table.grid thead th.blocked{background:#EFE1DC;color:var(--warn);text-decoration:line-through;}
  table.grid thead th.corner{position:sticky;left:0;top:0;z-index:3;background:#F6F2E8;text-align:left;padding:8px 10px;min-width:260px;}
  table.grid td.name-cell{position:sticky;left:0;background:var(--card);z-index:1;padding:6px 10px;min-width:260px;display:flex;align-items:center;gap:6px;flex-wrap:nowrap;}
  table.grid td.name-cell input[type=text]{border:none;background:transparent;font-size:13px;font-weight:500;color:var(--ink);width:92px;padding:4px 2px;border-radius:6px;flex:none;}
  table.grid td.name-cell input[type=text]:focus{outline:none;background:#F4F1E9;}
  table.grid td.name-cell select{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:3px 4px;background:#FCFAF6;color:var(--ink-soft);flex:none;max-width:98px;}
  .pref-count{font-size:10.5px;color:#fff;background:var(--sage);border-radius:20px;padding:1px 7px;white-space:nowrap;flex:none;}
  .pref-count.full{background:var(--sage-deep);}
  .pref-count.over{background:var(--warn);}
  table.grid td.chk{text-align:center;padding:0;width:34px;}
  table.grid td.chk input{width:16px;height:16px;accent-color:var(--sage-deep);cursor:pointer;}
  table.grid td.chk.blocked{background:#FBF6F1;}
  tr:hover td.name-cell{background:#F8F5EC;}

  /* Mobile-friendly preference cards (replaces the old checkbox grid) */
  .pref-list{display:flex;flex-direction:column;gap:10px;}
  .pref-card{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card);}
  .pref-card .head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
  .pref-card .head input[type=text]{font-size:15px;font-weight:600;border:none;background:transparent;flex:1;min-width:110px;padding:6px 4px;border-radius:6px;color:var(--ink);}
  .pref-card .head input[type=text]:focus{outline:none;background:#F4F1E9;}
  .pref-card .head select{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:6px 7px;background:#FCFAF6;color:var(--ink-soft);}
  .pref-card .head .family-input{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:6px 7px;background:#FCFAF6;color:var(--ink-soft);width:100px;}
  .pref-card .head .family-input:focus{outline:none;border-color:var(--sage-deep);background:#fff;}
  .chip-row{display:flex;flex-wrap:wrap;gap:7px;}
  .time-chip{font-size:12.5px;font-weight:500;padding:8px 12px;border-radius:20px;border:1.5px solid var(--line);background:#FCFAF6;color:var(--ink-soft);cursor:pointer;user-select:none;white-space:nowrap;-webkit-tap-highlight-color:transparent;}
  .time-chip:hover{border-color:#D8CDB4;}
  .time-chip.selected{background:var(--sage-deep);border-color:var(--sage-deep);color:#fff;}
  .blocked-details{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);}
  .blocked-details summary{cursor:pointer;font-size:12.5px;color:var(--ink-soft);font-weight:500;list-style:none;}
  .blocked-details summary::-webkit-details-marker{display:none;}
  .blocked-details summary:before{content:'▸ ';}
  .blocked-details[open] summary:before{content:'▾ ';}
  .blocked-details[open] summary{margin-bottom:10px;}
  .block-toggle-chip{font-size:12px;padding:7px 11px;border-radius:20px;border:1.5px solid var(--line);background:#FCFAF6;color:var(--ink-soft);cursor:pointer;-webkit-tap-highlight-color:transparent;}
  .block-toggle-chip.blocked{background:#F3DED6;border-color:#E6C7AE;color:var(--warn);text-decoration:line-through;}

  .results h2{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
  .stat-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .stat{flex:1;min-width:110px;background:#F8F5EC;border-radius:10px;padding:10px 12px;}
  .stat .num{font-family:'Fredoka',sans-serif;font-size:22px;font-weight:600;}
  .stat .lab{font-size:11.5px;color:var(--ink-soft);}
  .stat.c1 .num{color:var(--sage-deep);} .stat.c2 .num{color:#B08A2E;}
  .stat.c3 .num{color:#C07A3F;} .stat.c4 .num{color:var(--ink-soft);}
  .stat.c5 .num{color:var(--warn);}

  .grid-wrap{border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:640px;}
  table.sched-grid{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;}
  table.sched-grid thead th{position:sticky;top:0;background:#F6F2E8;z-index:2;padding:9px 10px;font-weight:600;color:var(--ink-soft);text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;}
  table.sched-grid td{padding:6px 8px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);vertical-align:middle;}
  table.sched-grid td:last-child{border-right:none;}
  table.sched-grid tr:last-child td{border-bottom:none;}
  td.grid-time{font-weight:600;color:var(--ink);white-space:nowrap;background:#FBF9F4;width:1%;}
  td.grid-cell{min-width:120px;}
  td.empty-cell{color:#B9B0A0;font-size:12px;font-style:italic;cursor:pointer;}
  td.empty-cell:hover{background:#F1F8EF;}
  td.unavailable-cell{color:#D8D2C4;font-size:12px;background:#FAF8F3;}
  td.blocked-cell{color:var(--warn);font-size:12px;background:#FBF0EA;text-decoration:line-through;}
  td.occupied-cell{cursor:pointer;}
  td.drop-hover{background:#E1EFDF;outline:2px dashed var(--sage-deep);outline-offset:-2px;}
  .name-box{display:inline-block;font-size:12.5px;font-weight:600;padding:5px 9px;border-radius:7px;cursor:grab;
    -webkit-tap-highlight-color:transparent;user-select:none;margin:2px 0;border:1.5px solid transparent;}
  .name-box:active{cursor:grabbing;}
  .name-box.dragging{opacity:.4;}
  .name-box.name-pref{background:#E4F2E2;color:#2E6B39;}
  .name-box.name-nonpref{background:#F9E3DE;color:#B0432A;}
  .name-box.name-neutral{background:#EFEAE0;color:#6B6255;}
  .name-box.name-selected{border-color:var(--ink);box-shadow:0 0 0 2px rgba(58,52,43,.15);}
  .name-box.name-conflict{outline:2px solid var(--warn);outline-offset:1px;}
  .tray{border:1.5px dashed var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px;background:#FCFAF6;}
  .tray-label{font-size:12px;color:var(--ink-soft);margin-bottom:8px;}
  .tray-boxes{display:flex;flex-wrap:wrap;gap:7px;min-height:36px;border-radius:8px;transition:background .1s ease;}
  .tray-boxes.drop-hover{background:#FBEFEA;outline:2px dashed var(--warn);outline-offset:2px;}
  .legend-dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle;margin:0 3px 0 6px;}
  .legend-dot.legend-green{background:#4E9A5B;}
  .legend-dot.legend-red{background:#C6603F;}
  .unsched{margin-top:14px;padding:12px 14px;background:#FBF0EA;border:1px solid #F0D6C4;border-radius:10px;color:var(--warn);font-size:13.5px;}

  footer{text-align:center;color:var(--ink-soft);font-size:12px;margin-top:24px;}
  @media (max-width:560px){
    table.sched-grid{font-size:12px;}
    td.grid-cell{min-width:92px;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ---------- Roster ---------- */
const RAW_NAMES = [
  "Willow","Elodie","Emmie","Rook","Abigail","Ivana",
  "Maren","Rory","Palmer","Nickie","Noah","Eleanor",
  "James","Gabriel","Olive","Christian","David","Connor",
  "Adele","Siena","Laurel","Harper","Evelyn","Jocelyn",
  "Liam","Palmer","Nico","Michael","Blair","Brooks",
  "Gwendy","Barrett","Viana","Kush","Shaan","Mia"
];
function dedupeNames(names){
  const seen = {};
  return names.map(n=>{ seen[n]=(seen[n]||0)+1; return seen[n]>1 ? `${n} (${seen[n]})` : n; });
}

const TEACHERS = ["Ms. Walsh","Ms. Capparelli"];

function buildDefaultStudents(){
  const students = dedupeNames(RAW_NAMES).map((name,i)=>({
    id:'s'+i, name, prefs:[null,null,null],
    teacher: i<18 ? TEACHERS[1] : TEACHERS[0], needs:'both', family:''
  }));
  // Evelyn and Jocelyn are twins — their parent can't be in two rooms at once,
  // so link them: same family tag means "schedule back-to-back, never overlapping."
  students.forEach(s=>{ if(s.name==='Evelyn' || s.name==='Jocelyn') s.family='Twins'; });
  return students;
}

let state = {
  students: buildDefaultStudents(),
  settings: { walshStart:"08:00", walshEnd:"14:00", cappStart:"08:00", cappEnd:"14:00", duration:10, capacity:1 },
  blocked: new Set(),
  format: 'rotate', // fixed: back-to-back is the only structure now
  blockedOpen: false,
  schedule: null,
  nextId: RAW_NAMES.length
};

/* ---------- Persistence: auto-save to this browser + manual backup file ---------- */
const STORAGE_KEY = 'pt-conference-scheduler-v1';
function serializeSchedule(schedule){
  if(!schedule) return null;
  return schedule.results.map(r=>({
    studentId: r.student.id,
    assigned: !!r.assigned,
    noRequest: !!r.noRequest,
    teacher: r.teacher || null,
    order: r.order || null,
    tier: r.tier || null,
    rowId: r.rowId,
    slotIndices: r.assigned ? r.unit.slotsIn.map(s=>s.index) : null
  }));
}
function serializeState(){
  return {
    students: state.students,
    settings: state.settings,
    blocked: Array.from(state.blocked),
    format: state.format,
    blockedOpen: state.blockedOpen,
    nextId: state.nextId,
    schedule: serializeSchedule(state.schedule)
  };
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(serializeState())); }catch(e){ /* storage unavailable, fail silently */ }
}
function rehydrateSchedule(saved){
  if(!Array.isArray(saved)) return null;
  const slots = generateSlots();
  const bySlotIndex = {}; slots.forEach(s=>bySlotIndex[s.index]=s);
  const dur = Number(state.settings.duration)||10;
  const results = saved.map(r=>{
    const student = state.students.find(s=>s.id===r.studentId);
    if(!student) return null; // student was deleted since this was saved
    if(!r.assigned){
      return { student, teacher:r.teacher, order:r.order, assigned:false, noRequest:r.noRequest, rowId:r.rowId || rowId(student.id, r.teacher) };
    }
    const slotsIn = (r.slotIndices||[]).map(i=>bySlotIndex[i]).filter(Boolean);
    if(slotsIn.length !== (r.slotIndices||[]).length) return null; // schedule window changed, slot no longer exists
    const label = slotsIn.length===2 ? pairLabel(slotsIn[0], slotsIn[1], r.order, dur) : singleLabel(slotsIn[0], r.teacher);
    const unit = { slotsIn, label, minutes:slotsIn[0].minutes };
    return { student, assigned:true, unit, tier:r.tier, teacher:r.teacher, order:r.order, rowId:r.rowId || rowId(student.id, r.teacher) };
  }).filter(Boolean);
  return { results };
}
function applyLoadedState(data){
  if(!data || !Array.isArray(data.students)) return false;
  state.students = data.students.map(s=>({
    id: s.id, name: s.name, prefs: s.prefs || [null,null,null],
    teacher: s.teacher || null, needs: s.needs || 'both', family: s.family || ''
  }));
  const incoming = data.settings || {};
  if(incoming.start && !incoming.walshStart){
    // migrate an older single-window backup to the new per-teacher shape
    incoming.walshStart = incoming.start; incoming.walshEnd = incoming.end;
    incoming.cappStart = incoming.start; incoming.cappEnd = incoming.end;
  }
  state.settings = Object.assign({walshStart:"08:00", walshEnd:"14:00", cappStart:"08:00", cappEnd:"14:00", duration:10, capacity:1}, incoming);
  state.blocked = new Set(data.blocked || []);
  state.format = 'rotate'; // structure is fixed; ignore any format saved in older backups
  state.blockedOpen = !!data.blockedOpen;
  state.nextId = data.nextId || state.students.length;
  state.schedule = rehydrateSchedule(data.schedule);
  return true;
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return false;
    return applyLoadedState(JSON.parse(raw));
  }catch(e){ return false; }
}
function resetToDefaults(){
  state.students = buildDefaultStudents();
  state.settings = { walshStart:"08:00", walshEnd:"14:00", cappStart:"08:00", cappEnd:"14:00", duration:10, capacity:1 };
  state.blocked = new Set();
  state.format = 'rotate';
  state.blockedOpen = false;
  state.schedule = null;
  state.nextId = RAW_NAMES.length;
}
function exportBackup(){
  const blob = new Blob([JSON.stringify(serializeState(), null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download='conference-scheduler-backup.json'; a.click();
  URL.revokeObjectURL(url);
}

/* ---------- Optional cross-device sync via /api/state (Vercel KV) ----------
   If this file is deployed on Vercel with the included api/state.js + KV
   database connected, changes sync across browsers/devices. If the API route
   isn't there (plain static hosting, or opened as a local file), this fails
   silently and the app just falls back to the per-browser localStorage save
   above — nothing else breaks. */
let selectedDrag = null; // {rowId, leg, key} — set when a name-box is tapped for touch-friendly move
let syncStatus = 'checking'; // 'checking' | 'synced' | 'saving' | 'offline'
let cloudSaveTimer = null;
function syncBadgeText(s){
  return s==='synced' ? 'Synced across devices ✓'
    : s==='saving' ? 'Syncing…'
    : s==='offline' ? 'Saved on this device only'
    : 'Checking sync…';
}
function setSyncStatus(s){
  syncStatus = s;
  const el = document.getElementById('syncBadge');
  if(el){ el.textContent = syncBadgeText(s); el.className = 'sync-badge sync-'+s; }
}
async function loadFromCloud(){
  try{
    const res = await fetch('/api/state');
    if(!res.ok) return {reachable:false, applied:false};
    const json = await res.json();
    if(json && json.data) return {reachable:true, applied: applyLoadedState(json.data)};
    return {reachable:true, applied:false};
  }catch(e){ return {reachable:false, applied:false}; }
}
async function saveToCloud(){
  try{
    const res = await fetch('/api/state', {
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(serializeState())
    });
    setSyncStatus(res.ok ? 'synced' : 'offline');
  }catch(e){ setSyncStatus('offline'); }
}
function scheduleCloudSave(){
  setSyncStatus('saving');
  if(cloudSaveTimer) clearTimeout(cloudSaveTimer);
  cloudSaveTimer = setTimeout(saveToCloud, 800);
}

/* ---------- Time helpers ---------- */
function toMinutes(hhmm){ const [h,m]=hhmm.split(':').map(Number); return h*60+m; }
function toLabel(mins){
  let h=Math.floor(mins/60), m=mins%60;
  const ampm = h>=12?'PM':'AM'; let h12=h%12; if(h12===0) h12=12;
  return `${h12}:${m.toString().padStart(2,'0')} ${ampm}`;
}
function inWindow(slot, key, dur){
  const s = toMinutes(state.settings[key+'Start']);
  const e = toMinutes(state.settings[key+'End']);
  return slot.minutes >= s && slot.minutes+dur <= e;
}
function generateSlots(){
  const dur=Number(state.settings.duration)||10;
  const start = Math.min(toMinutes(state.settings.walshStart), toMinutes(state.settings.cappStart));
  const end = Math.max(toMinutes(state.settings.walshEnd), toMinutes(state.settings.cappEnd));
  const slots=[]; let i=0;
  for(let t=start; t+dur<=end; t+=dur){ slots.push({index:i, minutes:t, label:toLabel(t)}); i++; }
  return slots;
}
function generateUnits(slots, mode){
  // mode: 'walsh' -> only slots Walsh is free, 'capp' -> only slots Capparelli is free,
  // anything else (default) -> slots where BOTH are free (needed for a joint/together meeting)
  const dur = Number(state.settings.duration)||10;
  const usable = slots.filter(s=>{
    if(state.blocked.has(s.index)) return false;
    if(mode==='walsh') return inWindow(s,'walsh',dur);
    if(mode==='capp') return inWindow(s,'capp',dur);
    return inWindow(s,'walsh',dur) && inWindow(s,'capp',dur);
  });
  return usable.map(s=>({slotsIn:[s], label:s.label, minutes:s.minutes}));
}

/* ---------- Scoring ---------- */
function slotScore(prefs, realIndex){
  if(prefs.includes(realIndex)) return 100;
  const given = prefs.filter(p=>p!==null && p!==undefined);
  if(given.length===0) return 12;
  const minDist = Math.min(...given.map(p=>Math.abs(p-realIndex)));
  return Math.max(1, 34 - minDist*7);
}
function unitScore(prefs, unit){
  return Math.max(...unit.slotsIn.map(s=>slotScore(prefs, s.index)));
}
function unitTier(prefs, unit){
  const indices = unit.slotsIn.map(s=>s.index);
  if(indices.some(i=>prefs.includes(i))) return 'matched';
  if(prefs.some(p=>p!==null)) return 'near';
  return 'none';
}
function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function hasPrefs(st){ return st.prefs.some(p=>p!==null); }

/* ---------- Generic optimizer over a list of units for a given student list ---------- */
function buildVirtualUnits(units, capacity){
  const vu=[];
  for(const u of units){ for(let c=0;c<capacity;c++) vu.push(u); }
  return vu;
}
function greedyAssign(students, vunits){
  const used = new Array(vunits.length).fill(false);
  const assign = {};
  for(const st of students){
    let bestVi=-1, bestScore=-Infinity;
    for(let vi=0; vi<vunits.length; vi++){
      if(used[vi]) continue;
      const sc = unitScore(st.prefs, vunits[vi]);
      if(sc>bestScore){ bestScore=sc; bestVi=vi; }
    }
    if(bestVi>=0){ assign[st.id]={vi:bestVi, score:bestScore}; used[bestVi]=true; }
    else assign[st.id]=null;
  }
  return assign;
}
function totalScore(assign){ return Object.values(assign).reduce((s,a)=>s+(a?a.score:0),0); }
function localSearch(students, vunits, assign){
  let improved=true, passes=0;
  while(improved && passes<6){
    improved=false; passes++;
    for(let i=0;i<students.length;i++){
      for(let j=i+1;j<students.length;j++){
        const a=students[i], b=students[j];
        const aa=assign[a.id], bb=assign[b.id];
        if(aa && bb){
          const curr=aa.score+bb.score;
          const swapA=unitScore(a.prefs, vunits[bb.vi]);
          const swapB=unitScore(b.prefs, vunits[aa.vi]);
          if(swapA+swapB>curr){ assign[a.id]={vi:bb.vi,score:swapA}; assign[b.id]={vi:aa.vi,score:swapB}; improved=true; }
        } else if(aa && !bb){
          const bAtA=unitScore(b.prefs, vunits[aa.vi]);
          if(bAtA>aa.score){ assign[b.id]={vi:aa.vi,score:bAtA}; assign[a.id]=null; improved=true; }
        } else if(!aa && bb){
          const aAtB=unitScore(a.prefs, vunits[bb.vi]);
          if(aAtB>bb.score){ assign[a.id]={vi:bb.vi,score:aAtB}; assign[b.id]=null; improved=true; }
        }
      }
    }
  }
  return assign;
}
function optimizeGroup(students, units, capacity){
  if(students.length===0) return {};
  const vunits = buildVirtualUnits(units, capacity);
  let best=null, bestScore=-Infinity;
  const restarts = 70;
  for(let r=0;r<restarts;r++){
    const order = shuffle(students);
    let assign = greedyAssign(order, vunits);
    assign = localSearch(students, vunits, assign);
    const sc = totalScore(assign);
    if(sc>bestScore){ bestScore=sc; best=assign; }
  }
  const results = {};
  students.forEach(st=>{
    const a = best[st.id];
    if(!a){ results[st.id] = {assigned:false}; return; }
    const unit = vunits[a.vi];
    results[st.id] = {assigned:true, unit, tier:unitTier(st.prefs, unit)};
  });
  return results;
}

function singleLabel(slot, teacher){
  return teacher ? `${slot.label} (${teacher.replace('Ms. ','')} only)` : slot.label;
}
function pairLabel(a, b, order, dur){
  const first = order==='WC' ? 'Walsh' : 'Capparelli';
  const second = order==='WC' ? 'Capparelli' : 'Walsh';
  return `${a.label} – ${toLabel(b.minutes+dur)} (${first} then ${second})`;
}
function rowId(studentId, teacher){ return studentId+'::'+(teacher||'both'); }

function rowTeacherColumns(r){
  // Returns [firstTeacherName, secondTeacherNameOrBlank] for CSV/display.
  if(r.unit && r.unit.slotsIn && r.unit.slotsIn.length===2){
    const first = r.order==='WC' ? 'Ms. Walsh' : 'Ms. Capparelli';
    const second = r.order==='WC' ? 'Ms. Capparelli' : 'Ms. Walsh';
    return [first, second];
  }
  if(r.teacher) return [r.teacher, ''];
  return ['Both (together)', ''];
}

function getRowOptions(r){
  const slots = generateSlots();
  const dur = Number(state.settings.duration)||10;
  const open = slots.filter(s=>!state.blocked.has(s.index));
  if(r.unit.slotsIn.length===2){
    const opts = [];
    for(const a of open){
      const b = open.find(x=>x.minutes===a.minutes+dur);
      if(!b) continue;
      const firstOk = r.order==='WC' ? inWindow(a,'walsh',dur) : inWindow(a,'capp',dur);
      const secondOk = r.order==='WC' ? inWindow(b,'capp',dur) : inWindow(b,'walsh',dur);
      if(firstOk && secondOk) opts.push({value:a.index, label:pairLabel(a,b,r.order,dur)});
    }
    return opts;
  }
  if(r.teacher){
    const key = r.teacher===TEACHERS[0] ? 'walsh' : 'capp';
    return open.filter(s=>inWindow(s,key,dur)).map(s=>({value:s.index, label:contextSingleLabel(s, r)}));
  }
  return open.filter(s=>inWindow(s,'walsh',dur) && inWindow(s,'capp',dur)).map(s=>({value:s.index, label:s.label}));
}

function applyRowEdit(r, newStartIndex){
  const slots = generateSlots();
  const bySlotIndex = {}; slots.forEach(s=>bySlotIndex[s.index]=s);
  const a = bySlotIndex[newStartIndex];
  if(!a) return;
  const dur = Number(state.settings.duration)||10;
  if(r.unit.slotsIn.length===2){
    const b = slots.find(s=>s.minutes===a.minutes+dur);
    if(!b) return;
    r.unit = { slotsIn:[a,b], label:pairLabel(a,b,r.order,dur), minutes:a.minutes };
  } else {
    r.unit = { slotsIn:[a], label:contextSingleLabel(a, r), minutes:a.minutes };
  }
  r.tier = unitTier(r.student.prefs, r.unit);
  r.manuallyEdited = true;
}

function rowSpan(r){
  const dur = Number(state.settings.duration)||10;
  return { start:r.unit.minutes, end:r.unit.minutes + dur*r.unit.slotsIn.length };
}
function spansOverlap(a,b){ return a.start < b.end && b.start < a.end; }

function computeConflicts(results){
  const assigned = results.filter(r=>r.assigned);
  const conflicts = {};
  function flag(list, suffix){
    if(list.length<2) return;
    list.forEach(r=>{
      const names = list.filter(x=>x!==r).map(x=>x.student.name + (suffix?` ${suffix}`:''));
      conflicts[r.rowId] = (conflicts[r.rowId]||[]).concat(names);
    });
  }
  if(state.format==='joint'){
    const capacity = Number(state.settings.capacity||1);
    const bySlot = {};
    assigned.forEach(r=>{ const idx=r.unit.slotsIn[0].index; (bySlot[idx]=bySlot[idx]||[]).push(r); });
    Object.values(bySlot).forEach(list=>{ if(list.length>capacity) flag(list); });
  } else if(state.format==='split'){
    const byKey = {};
    assigned.forEach(r=>{ const idx=r.unit.slotsIn[0].index; const key=r.teacher+':'+idx; (byKey[key]=byKey[key]||[]).push(r); });
    Object.values(byKey).forEach(list=>{ if(list.length>1) flag(list); });
  } else {
    const byKey = {};
    assigned.forEach(r=>{
      if(r.unit.slotsIn.length===2){
        const [a,b] = r.unit.slotsIn;
        const firstTeacher = r.order==='WC' ? TEACHERS[0] : TEACHERS[1];
        const secondTeacher = r.order==='WC' ? TEACHERS[1] : TEACHERS[0];
        (byKey[firstTeacher+':'+a.index]=byKey[firstTeacher+':'+a.index]||[]).push(r);
        (byKey[secondTeacher+':'+b.index]=byKey[secondTeacher+':'+b.index]||[]).push(r);
      } else {
        const idx = r.unit.slotsIn[0].index;
        (byKey[r.teacher+':'+idx]=byKey[r.teacher+':'+idx]||[]).push(r);
      }
    });
    Object.values(byKey).forEach(list=>{
      const unique = [...new Set(list)];
      if(unique.length>1) flag(unique);
    });
  }

  // Linked-family (e.g. sibling) overlaps — same parent can't be in two rooms at once
  const byFamily = {};
  assigned.forEach(r=>{
    const fam = (r.student.family||'').trim().toLowerCase();
    if(!fam) return;
    (byFamily[fam] = byFamily[fam]||[]).push(r);
  });
  Object.values(byFamily).forEach(group=>{
    for(let i=0;i<group.length;i++){
      for(let j=i+1;j<group.length;j++){
        const a=group[i], b=group[j];
        if(spansOverlap(rowSpan(a), rowSpan(b))) flag([a,b], '(same family — overlapping time)');
      }
    }
  });

  Object.keys(conflicts).forEach(k=>{ conflicts[k] = [...new Set(conflicts[k])]; });
  return conflicts;
}

function buildOccupancy(allResults, excludeRowIds){
  const occ = { joint:{}, walsh:{}, capp:{} };
  allResults.filter(r=>r.assigned && !excludeRowIds.has(r.rowId)).forEach(r=>{
    if(state.format==='joint'){
      const idx = r.unit.slotsIn[0].index;
      occ.joint[idx] = (occ.joint[idx]||0)+1;
    } else if(state.format==='split'){
      const idx = r.unit.slotsIn[0].index;
      const key = r.teacher===TEACHERS[0] ? 'walsh' : 'capp';
      occ[key][idx] = true;
    } else if(r.unit.slotsIn.length===2){
      const [a,b] = r.unit.slotsIn;
      const firstKey = r.order==='WC' ? 'walsh' : 'capp';
      const secondKey = r.order==='WC' ? 'capp' : 'walsh';
      occ[firstKey][a.index] = true; occ[secondKey][b.index] = true;
    } else {
      const idx = r.unit.slotsIn[0].index;
      const key = r.teacher===TEACHERS[0] ? 'walsh' : 'capp';
      occ[key][idx] = true;
    }
  });
  return occ;
}

function familyCandidates(r, occ, slots){
  const dur = Number(state.settings.duration)||10;
  const open = slots.filter(s=>!state.blocked.has(s.index));
  if(r.unit.slotsIn.length===2){
    const opts = [];
    for(const a of open){
      const b = open.find(x=>x.minutes===a.minutes+dur);
      if(!b) continue;
      const firstKey = r.order==='WC' ? 'walsh' : 'capp';
      const secondKey = r.order==='WC' ? 'capp' : 'walsh';
      if(!inWindow(a,firstKey,dur) || !inWindow(b,secondKey,dur)) continue;
      if(occ[firstKey][a.index] || occ[secondKey][b.index]) continue;
      opts.push({start:a.minutes, end:b.minutes+dur, slotsIn:[a,b], score:unitScore(r.student.prefs,{slotsIn:[a,b]})});
    }
    return opts;
  }
  if(r.teacher){
    const key = r.teacher===TEACHERS[0] ? 'walsh' : 'capp';
    return open.filter(s=>inWindow(s,key,dur) && !occ[key][s.index])
      .map(s=>({start:s.minutes, end:s.minutes+dur, slotsIn:[s], score:slotScore(r.student.prefs,s.index)}));
  }
  const capacity = Number(state.settings.capacity||1);
  return open.filter(s=>inWindow(s,'walsh',dur) && inWindow(s,'capp',dur) && (occ.joint[s.index]||0)<capacity)
    .map(s=>({start:s.minutes, end:s.minutes+dur, slotsIn:[s], score:slotScore(r.student.prefs,s.index)}));
}

function contextSingleLabel(slot, r){
  // Split format's own rows never show the "(Teacher only)" suffix — every split
  // row is inherently single-teacher, so keep that plain to match the original look.
  return state.format==='split' ? slot.label : singleLabel(slot, r.teacher);
}

function applyFamilySlots(r, cand){
  const dur = Number(state.settings.duration)||10;
  if(cand.slotsIn.length===2){
    r.unit = { slotsIn:cand.slotsIn, label:pairLabel(cand.slotsIn[0],cand.slotsIn[1],r.order,dur), minutes:cand.slotsIn[0].minutes };
  } else {
    r.unit = { slotsIn:cand.slotsIn, label:contextSingleLabel(cand.slotsIn[0], r), minutes:cand.slotsIn[0].minutes };
  }
  r.tier = unitTier(r.student.prefs, r.unit);
}

function repairFamilyPair(m1, m2, allResults, slots){
  const span1 = rowSpan(m1), span2 = rowSpan(m2);
  const alreadyGood = !spansOverlap(span1,span2) && (span1.end===span2.start || span2.end===span1.start);
  if(alreadyGood) return; // already back-to-back and non-overlapping — leave it alone

  const exclude = new Set([m1.rowId, m2.rowId]);
  const occ = buildOccupancy(allResults, exclude);
  const cands1 = familyCandidates(m1, occ, slots);
  const cands2 = familyCandidates(m2, occ, slots);
  if(!cands1.length || !cands2.length) return; // nothing available to repair with — will surface as a flagged conflict instead

  let best = null;
  for(const c1 of cands1){
    for(const c2 of cands2){
      if(c1.start < c2.end && c2.start < c1.end) continue; // still overlapping — not allowed
      const adjacent = c1.end===c2.start || c2.end===c1.start;
      const score = c1.score + c2.score + (adjacent ? 1000 : 0); // strongly prefer back-to-back
      if(!best || score>best.score) best = {c1,c2};
    }
  }
  if(!best) return;
  applyFamilySlots(m1, best.c1);
  applyFamilySlots(m2, best.c2);
}

function enforceFamilyPlacement(combined, slots){
  const groups = {};
  combined.forEach(r=>{
    if(!r.assigned) return;
    const fam = (r.student.family||'').trim().toLowerCase();
    if(!fam) return;
    (groups[fam] = groups[fam]||[]).push(r);
  });
  Object.values(groups).forEach(group=>{
    if(group.length<2) return;
    // Pairwise repair across the sorted-by-time group — handles the common 2-person
    // case exactly, and gives a reasonable best-effort result for larger families.
    group.sort((a,b)=>a.unit.minutes-b.unit.minutes);
    for(let i=0;i<group.length-1;i++){
      repairFamilyPair(group[i], group[i+1], combined, slots);
    }
  });
}

function scheduleRotate(students, slots){
  const open = slots.filter(s=>!state.blocked.has(s.index)).sort((a,b)=>a.minutes-b.minutes);
  const dur = Number(state.settings.duration)||10;

  function attempt(order){
    const usedWalsh = {}, usedCapp = {};
    open.forEach(s=>{
      usedWalsh[s.index] = !inWindow(s,'walsh',dur); // pre-block slots outside Walsh's own hours
      usedCapp[s.index] = !inWindow(s,'capp',dur);   // pre-block slots outside Capparelli's own hours
    });
    const assign = {};
    for(const st of order){
      const need = st.needs || 'both';
      let best = null;
      if(need==='walsh' || need==='capparelli'){
        const usedLane = need==='walsh' ? usedWalsh : usedCapp;
        for(const s of open){
          if(usedLane[s.index]) continue;
          const sc = slotScore(st.prefs, s.index);
          if(!best || sc>best.score) best = {score:sc, kind:'single', lane:need, slot:s};
        }
      } else {
        for(let i=0;i<open.length;i++){
          const a=open[i], b=open[i+1];
          if(!b || b.minutes !== a.minutes+dur) continue;
          if(!usedWalsh[a.index] && !usedCapp[b.index]){
            // tiny random tie-breaker: WC and CW score identically since
            // preference only depends on time, not teacher order, so without
            // this every tie would silently default to WC
            const sc = unitScore(st.prefs, {slotsIn:[a,b]}) + Math.random()*0.01;
            if(!best || sc>best.score) best = {score:sc, kind:'pair', order:'WC', a, b};
          }
          if(!usedCapp[a.index] && !usedWalsh[b.index]){
            const sc = unitScore(st.prefs, {slotsIn:[a,b]}) + Math.random()*0.01;
            if(!best || sc>best.score) best = {score:sc, kind:'pair', order:'CW', a, b};
          }
        }
      }
      if(best){
        if(best.kind==='single'){
          (best.lane==='walsh' ? usedWalsh : usedCapp)[best.slot.index] = true;
        } else if(best.order==='WC'){
          usedWalsh[best.a.index]=true; usedCapp[best.b.index]=true;
        } else {
          usedCapp[best.a.index]=true; usedWalsh[best.b.index]=true;
        }
      }
      assign[st.id] = best;
    }
    return assign;
  }

  let bestAssign=null, bestTotal=-Infinity;
  const restarts = students.length>0 ? 120 : 0;
  for(let r=0;r<restarts;r++){
    const assign = attempt(shuffle(students));
    const total = Object.values(assign).reduce((s,a)=>s+(a?a.score:0),0);
    if(total>bestTotal){ bestTotal=total; bestAssign=assign; }
  }

  const results = {};
  students.forEach(st=>{
    const a = bestAssign ? bestAssign[st.id] : null;
    if(!a){ results[st.id] = {assigned:false, teacher:null, rowId:rowId(st.id, st.needs)}; return; }
    let unit, teacher, order=null;
    if(a.kind==='single'){
      teacher = a.lane==='walsh' ? TEACHERS[0] : TEACHERS[1];
      unit = {slotsIn:[a.slot], label:singleLabel(a.slot, teacher), minutes:a.slot.minutes};
    } else {
      order = a.order;
      teacher = null;
      unit = {slotsIn:[a.a,a.b], label:pairLabel(a.a, a.b, order, dur), minutes:a.a.minutes};
    }
    results[st.id] = {assigned:true, unit, tier:unitTier(st.prefs, unit), teacher, order, rowId:rowId(st.id, teacher)};
  });
  return results;
}

function runOptimizer(){
  const slots = generateSlots();
  let combined = [];

  const noRequest = state.students.filter(s=>!hasPrefs(s));
  const wants = state.students.filter(hasPrefs);
  const needOf = s => s.needs || 'both';

  if(state.format==='split'){
    const walsh = wants.filter(s=> needOf(s)==='walsh' || needOf(s)==='both');
    const capp = wants.filter(s=> needOf(s)==='capparelli' || needOf(s)==='both');
    const unitsWalsh = generateUnits(slots,'walsh');
    const unitsCapp = generateUnits(slots,'capp');
    const rW = optimizeGroup(walsh, unitsWalsh, 1);
    const rC = optimizeGroup(capp, unitsCapp, 1);
    walsh.forEach(st=> combined.push({student:st, teacher:TEACHERS[0], rowId:rowId(st.id, TEACHERS[0]), ...rW[st.id]}));
    capp.forEach(st=> combined.push({student:st, teacher:TEACHERS[1], rowId:rowId(st.id, TEACHERS[1]), ...rC[st.id]}));
  } else if(state.format==='rotate'){
    const r = scheduleRotate(wants, slots);
    wants.forEach(st=> combined.push({student:st, ...r[st.id]}));
  } else {
    const units = generateUnits(slots,'joint');
    const capacity = Number(state.settings.capacity||1);
    const r = optimizeGroup(wants, units, capacity);
    wants.forEach(st=>{
      const need = needOf(st);
      const teacher = need==='both' ? null : (need==='walsh' ? TEACHERS[0] : TEACHERS[1]);
      combined.push({student:st, teacher, rowId:rowId(st.id, teacher), ...r[st.id]});
    });
  }
  noRequest.forEach(st=> combined.push({student:st, teacher:null, rowId:rowId(st.id, null), assigned:false, noRequest:true}));

  enforceFamilyPlacement(combined, slots);
  state.schedule = { results: combined };
  render();
}

            <div class="field"><label for="walshStart">Starts at</label><input id="walshStart" type="time" value="${state.settings.walshStart}"></div>
            <div class="field"><label for="walshEnd">Ends by</label><input id="walshEnd" type="time" value="${state.settings.walshEnd}"></div>
          </div>
        </div>
        <div class="teacher-window">
          <div class="tw-label">Ms. Capparelli's availability</div>
          <div class="settings-grid">
            <div class="field"><label for="cappStart">Starts at</label><input id="cappStart" type="time" value="${state.settings.cappStart}"></div>
            <div class="field"><label for="cappEnd">Ends by</label><input id="cappEnd" type="time" value="${state.settings.cappEnd}"></div>
          </div>
        </div>
      </div>
      <div class="settings-grid" style="margin-top:12px;">
        <div class="field"><label for="duration">Time per teacher (minutes)</label><input id="duration" type="number" min="5" step="5" value="${state.settings.duration}"></div>
      </div>
      ${renderBlockedPicker(slots)}
      ${renderStatus(slots)}
    </section>

    <section class="card">
      <h2>Student time preferences</h2>

        <button class="btn-primary btn-big" id="optimizeBtn">Build optimized schedule</button>
        <button class="btn-secondary" id="addStudentBtn">+ Add student</button>

    ${state.schedule ? renderResults(state.schedule) : ''}

    <footer>Saved automatically in this browser only. Use "Download backup" before switching computers or browsers, then "Restore backup" there.</footer>
  `;

  attachHandlers(slots);

  window.scrollTo(0, pageScrollY);
  const newWrap = document.querySelector('.table-wrap');
  if(newWrap){ newWrap.scrollTop = wrapScrollTop; newWrap.scrollLeft = wrapScrollLeft; }
  if(activeSelector){
    const toFocus = document.querySelector(activeSelector);
    if(toFocus && typeof toFocus.focus === 'function') toFocus.focus({preventScroll:true});
  }
  saveState();
  scheduleCloudSave();
}

function renderStatus(slots){
  const wantsAll = state.students.filter(hasPrefs);
  const n = wantsAll.length;
  const optedOut = state.students.length - n;
  const optOutLine = optedOut>0 ? `<div class="status-line">${optedOut} student${optedOut>1?'s':''} with no times checked won't be scheduled (assumed no conference requested).</div>` : '';
  const needOf = s => s.needs || 'both';
  const dur = Number(state.settings.duration)||10;
  if(state.format==='split'){
    const walshN = wantsAll.filter(s=>needOf(s)==='walsh' || needOf(s)==='both').length;
    const cappN = wantsAll.filter(s=>needOf(s)==='capparelli' || needOf(s)==='both').length;
    const walshOpen = generateUnits(slots,'walsh').length;
    const cappOpen = generateUnits(slots,'capp').length;
    const wOk = walshOpen >= walshN, cOk = cappOpen >= cappN;
    let lines = `
      <div class="status-line ${wOk?'':'warn'}">Ms. Walsh: ${walshOpen} slots available for ${walshN} students. ${wOk?'Enough room.':'Not enough — extend her hours or shorten slots.'}</div>
      <div class="status-line ${cOk?'':'warn'}">Ms. Capparelli: ${cappOpen} slots available for ${cappN} students. ${cOk?'Enough room.':'Not enough — extend her hours or shorten slots.'}</div>
    `;
    return lines + optOutLine;
  }
  if(state.format==='rotate'){
    const openWalsh = slots.filter(s=>!state.blocked.has(s.index) && inWindow(s,'walsh',dur)).length;
    const openCapp = slots.filter(s=>!state.blocked.has(s.index) && inWindow(s,'capp',dur)).length;
    const bothN = wantsAll.filter(s=>needOf(s)==='both').length;
    const walshOnlyN = wantsAll.filter(s=>needOf(s)==='walsh').length;
    const cappOnlyN = wantsAll.filter(s=>needOf(s)==='capparelli').length;
    const walshDemand = bothN + walshOnlyN, cappDemand = bothN + cappOnlyN;
    const ok = walshDemand<=openWalsh && cappDemand<=openCapp;
    return `<div class="status-line ${ok?'':'warn'}">Ms. Walsh has ${openWalsh} slots (needs ${walshDemand}); Ms. Capparelli has ${openCapp} slots (needs ${cappDemand}). Two-teacher families count toward both. ${ok?'Enough room.':'Not enough — extend hours or shorten the per-teacher time.'}</div>${optOutLine}`;
  }
  const jointOpen = generateUnits(slots,'joint').length;
  const capacity = Number(state.settings.capacity||1);
  const total = jointOpen*capacity;
  const ok = total >= n;
  return `<div class="status-line ${ok?'':'warn'}">${total} total slots available (${jointOpen} time × ${capacity} at once, when both teachers are free) for ${n} students. ${ok?"There's enough room for everyone.":"Not enough room yet — check that both teachers' hours overlap, shorten the slot length, or add rooms."}</div>${optOutLine}`;
}

function renderBlockedPicker(slots){
  const chips = slots.map(s=>{
    const blocked = state.blocked.has(s.index);
    return `<button type="button" class="block-toggle-chip ${blocked?'blocked':''}" data-toggle-block="${s.index}">${s.label}</button>`;
  }).join('');
  const summaryText = state.blocked.size>0
    ? `${state.blocked.size} time${state.blocked.size>1?'s':''} blocked — tap to edit`
    : 'Block a time off (e.g. a lunch break)';
  return `<details class="blocked-details" ${state.blockedOpen?'open':''}>
    <summary>${summaryText}</summary>
    <div class="chip-row">${chips}</div>
  </details>`;
}

function renderPreferenceCards(slots){
  const openSlots = slots.filter(s=>!state.blocked.has(s.index));
  const cards = state.students.map(st=>{
    const count = st.prefs.filter(p=>p!==null).length;
    const chips = openSlots.map(s=>{
      const selected = st.prefs.includes(s.index);
      return `<button type="button" class="time-chip ${selected?'selected':''}" data-chip-student="${st.id}" data-chip-slot="${s.index}">${s.label}</button>`;
    }).join('');
    return `<div class="pref-card">
      <div class="head">
        <input type="text" value="${escapeHtml(st.name)}" data-rename="${st.id}">
        <select data-teacher="${st.id}" title="Homeroom teacher">
          <option value="">— homeroom —</option>
          <option value="${TEACHERS[0]}" ${st.teacher===TEACHERS[0]?'selected':''}>Walsh</option>
          <option value="${TEACHERS[1]}" ${st.teacher===TEACHERS[1]?'selected':''}>Capparelli</option>
        </select>
        <select data-needs="${st.id}" title="Which teacher(s) this family still needs a conference with">
          <option value="both" ${(st.needs||'both')==='both'?'selected':''}>Needs both</option>
          <option value="walsh" ${st.needs==='walsh'?'selected':''}>Walsh only</option>
          <option value="capparelli" ${st.needs==='capparelli'?'selected':''}>Capparelli only</option>
        </select>
        <input type="text" class="family-input" placeholder="Family (optional)" value="${escapeHtml(st.family||'')}" data-family="${st.id}" title="Students sharing this tag (e.g. siblings) will be scheduled back-to-back, never at the same time">
        <span class="pref-count ${count>3?'over':count===3?'full':''}">${count}/3</span>
        <button class="btn-ghost" data-remove="${st.id}" title="Remove student">✕</button>
      </div>
      <div class="chip-row">${chips}</div>
    </div>`;
  }).join('');
  return `<div class="pref-list">${cards}</div>`;
}

function buildGridCells(results){
  const cells = {}; // `${slotIndex}:${teacherKey}` -> [{r, leg}]
  function push(slotIdx, teacherKey, r, leg){
    const key = slotIdx+':'+teacherKey;
    (cells[key] = cells[key]||[]).push({r, leg});
  }
  results.filter(r=>r.assigned).forEach(r=>{
    if(r.unit.slotsIn.length===2){
      const [a,b] = r.unit.slotsIn;
      const firstKey = r.order==='WC' ? 'walsh' : 'capp';
      const secondKey = r.order==='WC' ? 'capp' : 'walsh';
      push(a.index, firstKey, r, 0);
      push(b.index, secondKey, r, 1);
    } else if(r.teacher){
      const key = r.teacher===TEACHERS[0] ? 'walsh' : 'capp';
      push(r.unit.slotsIn[0].index, key, r, 0);
    } else {
      // joint "both" meeting — same time, both teachers present
      push(r.unit.slotsIn[0].index, 'walsh', r, 0);
      push(r.unit.slotsIn[0].index, 'capp', r, 0);
    }
  });
  return cells;
}

function renderGridCell(slot, teacherKey, cells, conflicts, blocked, dur){
  if(blocked) return `<td class="grid-cell blocked-cell">Blocked</td>`;
  const key = slot.index+':'+teacherKey;
  const occupants = cells[key]||[];
  const available = inWindow(slot, teacherKey, dur);
  if(occupants.length===0){
    if(!available) return `<td class="grid-cell unavailable-cell">—</td>`;
    return `<td class="grid-cell empty-cell" data-target-slot="${slot.index}" data-target-teacher="${teacherKey}">Available</td>`;
  }
  const boxes = occupants.map(({r,leg})=>{
    const conflictNames = conflicts[r.rowId];
    const dragKey = r.rowId+'::'+leg;
    const selected = selectedDrag && selectedDrag.key===dragKey;
    const colorClass = r.tier==='matched' ? 'name-pref' : r.tier==='none' ? 'name-neutral' : 'name-nonpref';
    const tooltip = r.tier==='matched' ? 'Got a preferred time' : r.tier==='none' ? 'Manually added — no preference was given' : 'Not a preferred time';
    return `<div class="name-box ${colorClass} ${conflictNames?'name-conflict':''} ${selected?'name-selected':''}"
      draggable="true" data-drag-row="${r.rowId}" data-drag-leg="${leg}"
      title="${conflictNames?('⚠ Conflict: '+conflictNames.join(', ')):tooltip}">${escapeHtml(r.student.name)}</div>`;
  }).join('');
  return `<td class="grid-cell occupied-cell" data-target-slot="${slot.index}" data-target-teacher="${teacherKey}">${boxes}</td>`;
}

function renderScheduleGrid(schedule, slots){
  const dur = Number(state.settings.duration)||10;
  const cells = buildGridCells(schedule.results);
  const conflicts = computeConflicts(schedule.results);
  const rows = slots.map(s=>{
    const blocked = state.blocked.has(s.index);
    return `<tr><td class="grid-time">${s.label}</td>${renderGridCell(s,'walsh',cells,conflicts,blocked,dur)}${renderGridCell(s,'capp',cells,conflicts,blocked,dur)}</tr>`;
  }).join('');
  return `<div class="grid-wrap"><table class="sched-grid">
    <thead><tr><th>Time</th><th>Ms. Walsh</th><th>Ms. Capparelli</th></tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

function cellOccupant(slotIndex, teacherKey, excludeRowId){
  if(!state.schedule) return null;
  const cells = buildGridCells(state.schedule.results);
  const occ = (cells[slotIndex+':'+teacherKey]||[]).filter(o=>o.r.rowId!==excludeRowId);
  return occ.length ? occ[0].r : null;
}

function placeUnscheduledStudent(r, targetSlotIndex, targetTeacherKey){
  const slots = generateSlots();
  const slot = slots.find(s=>s.index===targetSlotIndex);
  if(!slot) return false;
  const dur = Number(state.settings.duration)||10;
  if(state.blocked.has(slot.index)){ alert('That time is blocked off.'); return false; }

  const need = r.student.needs || 'both';
  if(need==='walsh' || need==='capparelli'){
    const requiredKey = need==='walsh' ? 'walsh' : 'capp';
    if(targetTeacherKey!==requiredKey){
      alert(`${r.student.name} only needs Ms. ${need==='walsh'?'Walsh':'Capparelli'} — drop in that column.`);
      return false;
    }
    if(!inWindow(slot, requiredKey, dur)){ alert('That teacher is not available at that time.'); return false; }
    const occ = cellOccupant(slot.index, requiredKey, r.rowId);
    if(occ){ alert(`That slot is already taken by ${occ.student.name}. Move them first, or choose an open cell.`); return false; }
    r.teacher = requiredKey==='walsh' ? TEACHERS[0] : TEACHERS[1];
    r.order = null;
    r.unit = { slotsIn:[slot], label: contextSingleLabel(slot, r), minutes: slot.minutes };
  } else {
    // Needs both — dropping a cell places the FIRST leg there; the second leg
    // is created automatically right after, with the other teacher.
    const partner = slots.find(s=>s.minutes===slot.minutes+dur);
    if(!partner){ alert('Not enough room after that time for a back-to-back appointment — try an earlier slot.'); return false; }
    const order = targetTeacherKey==='walsh' ? 'WC' : 'CW';
    const partnerKey = targetTeacherKey==='walsh' ? 'capp' : 'walsh';
    if(!inWindow(slot, targetTeacherKey, dur) || !inWindow(partner, partnerKey, dur)){
      alert('One of the two teachers is not available for the full back-to-back appointment starting there.');
      return false;
    }
    if(state.blocked.has(partner.index)){ alert('The slot right after that one is blocked, so a back-to-back appointment can\'t start there.'); return false; }
    const occ1 = cellOccupant(slot.index, targetTeacherKey, r.rowId);
    const occ2 = cellOccupant(partner.index, partnerKey, r.rowId);
    if(occ1 || occ2){
      const blockedSlot = occ1 ? slot : partner;
      const blockedTeacher = occ1 ? (targetTeacherKey==='walsh'?'Ms. Walsh':'Ms. Capparelli') : (partnerKey==='walsh'?'Ms. Walsh':'Ms. Capparelli');
      const who = (occ1||occ2).student.name;
      alert(`This back-to-back appointment would need ${blockedTeacher} at ${blockedSlot.label}, which is already taken by ${who}. Move ${who} first, or try a different starting time.`);
      return false;
    }
    r.teacher = null;
    r.order = order;
    r.unit = { slotsIn:[slot, partner], label: pairLabel(slot, partner, order, dur), minutes: slot.minutes };
  }
  r.tier = 'none';
  r.assigned = true;
  r.noRequest = false;
  return true;
}

function unscheduleRow(rowId){
  if(!state.schedule) return;
  const r = state.schedule.results.find(x=>x.rowId===rowId);
  if(!r || !r.assigned) return;
  r.assigned = false;
  r.unit = undefined;
  r.teacher = null; r.order = null; r.tier = null;
  r.noRequest = !hasPrefs(r.student);
}

function handleGridDrop(rowId, leg, targetSlotIndex, targetTeacherKey){
  if(!state.schedule) return;
  const r = state.schedule.results.find(x=>x.rowId===rowId);
  if(!r) return;
  if(leg==='new'){
    placeUnscheduledStudent(r, targetSlotIndex, targetTeacherKey);
    selectedDrag = null; render();
    return;
  }
  if(!r.assigned) return;
  if(r.unit.slotsIn.length===1 && r.teacher){
    const allowedKey = r.teacher===TEACHERS[0] ? 'walsh' : 'capp';
    if(targetTeacherKey!==allowedKey){ alert(`${r.student.name} only needs ${r.teacher} — drop within that column.`); return; }
    const opts = getRowOptions(r);
    if(!opts.some(o=>o.value===targetSlotIndex)){ alert('That time is outside the available window for this appointment.'); return; }
    const occ = cellOccupant(targetSlotIndex, targetTeacherKey, r.rowId);
    if(occ){ alert(`That slot is already taken by ${occ.student.name}. Move them first, or choose an open cell.`); return; }
    applyRowEdit(r, targetSlotIndex);
  } else if(r.unit.slotsIn.length===1 && !r.teacher){
    const opts = getRowOptions(r);
    if(!opts.some(o=>o.value===targetSlotIndex)){ alert('That time is outside the window both teachers are free.'); return; }
    const occ = cellOccupant(targetSlotIndex, targetTeacherKey, r.rowId);
    if(occ){ alert(`That slot is already taken by ${occ.student.name}. Move them first, or choose an open cell.`); return; }
    applyRowEdit(r, targetSlotIndex);
  } else {
    // Back-to-back pair: wherever you drop a leg becomes THAT visit's time,
    // with the partner visit (the other teacher) automatically right after —
    // regardless of whether you dragged the first or second leg.
    const oldOrder = r.order;
    const newOrder = targetTeacherKey==='walsh' ? 'WC' : 'CW';
    const newStart = targetSlotIndex;
    r.order = newOrder;
    const opts = getRowOptions(r);
    if(!opts.some(o=>o.value===newStart)){
      r.order = oldOrder;
      alert('That would put this appointment outside available hours, or off the edge of the timeline.');
      return;
    }
    const dur = Number(state.settings.duration)||10;
    const slots = generateSlots();
    const startSlot = slots.find(s=>s.index===newStart);
    const endSlot = slots.find(s=>s.minutes===startSlot.minutes+dur);
    const firstKey = newOrder==='WC' ? 'walsh' : 'capp';
    const secondKey = newOrder==='WC' ? 'capp' : 'walsh';
    const occ1 = cellOccupant(startSlot.index, firstKey, r.rowId);
    const occ2 = cellOccupant(endSlot.index, secondKey, r.rowId);
    if(occ1 || occ2){
      r.order = oldOrder;
      const blockedSlot = occ1 ? startSlot : endSlot;
      const blockedTeacher = occ1 ? (firstKey==='walsh'?'Ms. Walsh':'Ms. Capparelli') : (secondKey==='walsh'?'Ms. Walsh':'Ms. Capparelli');
      const who = (occ1||occ2).student.name;
      alert(`This back-to-back appointment would need ${blockedTeacher} at ${blockedSlot.label}, which is already taken by ${who}. Move ${who} first, or choose a different cell.`);
      return;
    }
    applyRowEdit(r, newStart);
  }
  selectedDrag = null;
  render();
}

function exportPreferencesCSV(){
  const slots = generateSlots();
  const bySlotIndex = {}; slots.forEach(s=>bySlotIndex[s.index]=s);
  const needsLabel = {walsh:'Walsh only', capparelli:'Capparelli only', both:'Both'};
  const rows = [['Student','Homeroom','Needs','Family','Preferred Time 1','Preferred Time 2','Preferred Time 3']];
  state.students.forEach(st=>{
    const prefLabels = st.prefs.map(p=> (p!==null && bySlotIndex[p]) ? bySlotIndex[p].label : '');
    rows.push([
      st.name,
      st.teacher ? st.teacher.replace('Ms. ','') : '',
      needsLabel[st.needs||'both'],
      st.family || '',
      prefLabels[0], prefLabels[1], prefLabels[2]
    ]);
  });
  const csv = rows.map(row=> row.map(cell=>`"${String(cell).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download='conference-preferences.csv'; a.click();
  URL.revokeObjectURL(url);
}

function renderResults(schedule){
  const {results} = schedule;
  const assigned = results.filter(r=>r.assigned);
  const unassigned = results.filter(r=>!r.assigned && !r.noRequest);
  const noRequest = results.filter(r=>r.noRequest);
  const conflicts = computeConflicts(results);

  const counts = {matched:0, near:0, none:0};
  assigned.forEach(r=>counts[r.tier]++);
  const conflictCount = Object.keys(conflicts).length;
  const slots = generateSlots();

  return `
    <section class="card results">
      <h2>Optimized schedule <button class="btn-secondary" id="exportBtn">Export schedule CSV</button></h2>
      <div class="status-line" style="margin-bottom:14px;">Drag a name (or tap it, then tap a target cell) to move that appointment. <span class="legend-dot legend-green"></span> preferred time &nbsp; <span class="legend-dot legend-red"></span> not preferred.</div>
      <div class="stat-row">
        <div class="stat c1"><div class="num">${counts.matched}</div><div class="lab">Got a preferred time</div></div>
        <div class="stat c4"><div class="num">${counts.near}</div><div class="lab">Closest available</div></div>
        <div class="stat c5"><div class="num">${unassigned.length}</div><div class="lab">Could not schedule</div></div>
      </div>
      ${conflictCount ? `<div class="status-line warn" style="margin-bottom:14px;">⚠ ${conflictCount} appointment${conflictCount>1?'s':''} currently conflict — outlined in red below.</div>` : ''}
      ${renderUnscheduledTray(unassigned, noRequest)}
      ${renderScheduleGrid(schedule, slots)}
    </section>
  `;
}

function renderUnscheduledTray(unassigned, noRequest){
  const pool = [...unassigned, ...noRequest];
  if(pool.length===0) return '';
  return `<div class="tray">
    <div class="tray-label">Not on the schedule (${pool.length}) — drag a name onto an open cell above to add them, or drag a scheduled name back here to remove it:</div>
    <div class="tray-boxes">
      ${pool.map(r=>`<div class="name-box name-neutral" draggable="true" data-drag-row="${r.rowId}" data-drag-leg="new" title="Drag onto an open cell to schedule">${escapeHtml(r.student.name)}</div>`).join('')}
    </div>
  </div>`;
}

function escapeHtml(str){ const d=document.createElement('div'); d.textContent=str; return d.innerHTML; }

/* ---------- Event wiring ---------- */
function attachHandlers(slots){
  document.getElementById('walshStart').onchange = e=>{ state.settings.walshStart=e.target.value; state.schedule=null; render(); };
  document.getElementById('walshEnd').onchange = e=>{ state.settings.walshEnd=e.target.value; state.schedule=null; render(); };
  document.getElementById('cappStart').onchange = e=>{ state.settings.cappStart=e.target.value; state.schedule=null; render(); };
  document.getElementById('cappEnd').onchange = e=>{ state.settings.cappEnd=e.target.value; state.schedule=null; render(); };
  document.getElementById('duration').onchange = e=>{ state.settings.duration=e.target.value; state.schedule=null; render(); };
  const capEl = document.getElementById('capacity');
  if(capEl) capEl.onchange = e=>{ state.settings.capacity=e.target.value; state.schedule=null; render(); };

  document.getElementById('optimizeBtn').onclick = ()=> runOptimizer();
  document.getElementById('addStudentBtn').onclick = ()=>{
    state.students.push({id:'s'+(state.nextId++), name:'New student', prefs:[null,null,null], teacher:null, needs:'both', family:''});
    state.schedule=null; render();
  };
  document.getElementById('clearPrefsBtn').onclick = ()=>{
    state.students.forEach(s=>s.prefs=[null,null,null]); state.schedule=null; render();
  };
  const exportBtn = document.getElementById('exportBtn');
  if(exportBtn) exportBtn.onclick = exportCSV;
  const exportPrefsBtn = document.getElementById('exportPrefsBtn');
  if(exportPrefsBtn) exportPrefsBtn.onclick = exportPreferencesCSV;

  // Schedule grid: drag-and-drop (desktop) + tap-to-select/tap-to-place (touch-friendly)
  function parseLeg(raw){ return raw==='new' ? 'new' : Number(raw); }

  document.querySelectorAll('.name-box[data-drag-row]').forEach(box=>{
    box.addEventListener('dragstart', e=>{
      e.dataTransfer.setData('text/plain', JSON.stringify({rowId:box.dataset.dragRow, leg:parseLeg(box.dataset.dragLeg)}));
      box.classList.add('dragging');
    });
    box.addEventListener('dragend', ()=> box.classList.remove('dragging'));
    box.onclick = (e)=>{
      e.stopPropagation();
      const key = box.dataset.dragRow+'::'+box.dataset.dragLeg;
      selectedDrag = (selectedDrag && selectedDrag.key===key) ? null : { rowId:box.dataset.dragRow, leg:parseLeg(box.dataset.dragLeg), key };
      render();
    };
  });
  document.querySelectorAll('.grid-cell[data-target-slot]').forEach(cell=>{
    cell.addEventListener('dragover', e=>{ e.preventDefault(); cell.classList.add('drop-hover'); });
    cell.addEventListener('dragleave', ()=> cell.classList.remove('drop-hover'));
    cell.addEventListener('drop', e=>{
      e.preventDefault(); cell.classList.remove('drop-hover');
      let data; try{ data = JSON.parse(e.dataTransfer.getData('text/plain')); }catch(err){ return; }
      handleGridDrop(data.rowId, data.leg, Number(cell.dataset.targetSlot), cell.dataset.targetTeacher);
    });
    cell.onclick = ()=>{
      if(!selectedDrag) return;
      handleGridDrop(selectedDrag.rowId, selectedDrag.leg, Number(cell.dataset.targetSlot), cell.dataset.targetTeacher);
    };
  });
  const tray = document.querySelector('.tray-boxes');
  if(tray){
    tray.addEventListener('dragover', e=>{ e.preventDefault(); tray.classList.add('drop-hover'); });
    tray.addEventListener('dragleave', ()=> tray.classList.remove('drop-hover'));
    tray.addEventListener('drop', e=>{
      e.preventDefault(); tray.classList.remove('drop-hover');
      let data; try{ data = JSON.parse(e.dataTransfer.getData('text/plain')); }catch(err){ return; }
      if(data.leg==='new') return; // already unscheduled
      unscheduleRow(data.rowId);
      render();
    });
    tray.onclick = (e)=>{
      if(e.target.closest('.name-box')) return; // clicking a tray name selects it, handled above
      if(!selectedDrag || selectedDrag.leg==='new') return;
      unscheduleRow(selectedDrag.rowId);
      selectedDrag = null;
      render();
    };
  }

  const backupBtn = document.getElementById('backupBtn');
  if(backupBtn) backupBtn.onclick = exportBackup;
  const resetBtn = document.getElementById('resetBtn');
  if(resetBtn) resetBtn.onclick = ()=>{
    if(confirm('This clears all saved names, preferences, and settings in this browser and starts over with the default roster. Continue?')){
      try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
      resetToDefaults();
      render();
    }
  };
  const restoreBtn = document.getElementById('restoreBtn');
  const restoreFile = document.getElementById('restoreFile');
  if(restoreBtn && restoreFile){
    restoreBtn.onclick = ()=> restoreFile.click();
    restoreFile.onchange = (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = ()=>{
        try{
          const data = JSON.parse(reader.result);
          if(!applyLoadedState(data)) throw new Error('bad file');
          state.schedule = null;
          saveState();
          render();
        }catch(err){ alert('Could not read that backup file — it may not be a scheduler backup.'); }
      };
      reader.readAsText(file);
      restoreFile.value = '';
    };
  }

  document.querySelectorAll('[data-toggle-block]').forEach(btn=>{
    btn.onclick = ()=>{
      const idx = Number(btn.dataset.toggleBlock);
      if(state.blocked.has(idx)) state.blocked.delete(idx); else state.blocked.add(idx);
      state.blockedOpen = true;
      state.schedule=null; render();
    };
  });
  const blockedDetails = document.querySelector('.blocked-details');
  if(blockedDetails) blockedDetails.addEventListener('toggle', function(){ state.blockedOpen = this.open; });

  document.querySelectorAll('.time-chip[data-chip-student]').forEach(chip=>{
    chip.onclick = ()=>{
      const st = state.students.find(s=>s.id===chip.dataset.chipStudent);
      const slotIdx = Number(chip.dataset.chipSlot);
      const pos = st.prefs.indexOf(slotIdx);
      if(pos>=0){
        st.prefs[pos] = null;
      } else {
        const filled = st.prefs.filter(p=>p!==null).length;
        if(filled>=3){ alert(`${st.name} already has 3 preferred times selected. Tap one to remove it first.`); return; }
        st.prefs[st.prefs.indexOf(null)] = slotIdx;
      }
      state.schedule=null; render();
    };
  });

  document.querySelectorAll('input[data-rename]').forEach(inp=>{
    inp.onchange = ()=>{ const st=state.students.find(s=>s.id===inp.dataset.rename); st.name=inp.value.trim()||'Unnamed'; state.schedule=null; saveState(); scheduleCloudSave(); };
  });

  document.querySelectorAll('select[data-teacher]').forEach(sel=>{
    sel.onchange = ()=>{ const st=state.students.find(s=>s.id===sel.dataset.teacher); st.teacher = sel.value || null; state.schedule=null; saveState(); scheduleCloudSave(); };
  });

  document.querySelectorAll('select[data-needs]').forEach(sel=>{
    sel.onchange = ()=>{ const st=state.students.find(s=>s.id===sel.dataset.needs); st.needs = sel.value || 'both'; state.schedule=null; render(); };
  });

  document.querySelectorAll('input[data-family]').forEach(inp=>{
    inp.onchange = ()=>{ const st=state.students.find(s=>s.id===inp.dataset.family); st.family = inp.value.trim(); state.schedule=null; saveState(); scheduleCloudSave(); };
  });

  document.querySelectorAll('button[data-remove]').forEach(btn=>{
    btn.onclick = ()=>{ state.students = state.students.filter(s=>s.id!==btn.dataset.remove); state.schedule=null; render(); };
  });
}

function exportCSV(){
  if(!state.schedule) return;
  const slots = generateSlots();
  const dur = Number(state.settings.duration)||10;
  const cells = buildGridCells(state.schedule.results);

  function cellText(slot, teacherKey){
    const occ = cells[slot.index+':'+teacherKey]||[];
    if(occ.length>0) return occ.map(o=>o.r.student.name).join(' / ');
    return inWindow(slot, teacherKey, dur) ? 'Available' : '';
  }

  const rows = [['Time','Ms. Walsh','Ms. Capparelli']];
  slots.forEach(s=>{
    if(state.blocked.has(s.index)){ rows.push([s.label, 'Blocked', 'Blocked']); return; }
    rows.push([s.label, cellText(s,'walsh'), cellText(s,'capp')]);
  });

  const unassigned = state.schedule.results.filter(r=>!r.assigned && !r.noRequest);
  const noRequest = state.schedule.results.filter(r=>r.noRequest);
  if(unassigned.length || noRequest.length){
    rows.push(['','','']);
    rows.push(['Not on the schedule','','']);
    unassigned.forEach(r=> rows.push([r.student.name, 'Could not be fit in', '']));
    noRequest.forEach(r=> rows.push([r.student.name, 'No preference given', '']));
  }

  const csv = rows.map(row=> row.map(cell=>`"${String(cell).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download='conference-schedule.csv'; a.click();
  URL.revokeObjectURL(url);
}

loadState();  // instant baseline from this browser, so the page never looks empty
render();
loadFromCloud().then(result=>{
  if(result.applied){ state.schedule = null; render(); }
  else { setSyncStatus(result.reachable ? 'synced' : 'offline'); }
});

</script>
</body>
</html>
